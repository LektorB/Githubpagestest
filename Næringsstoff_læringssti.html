      "<section class=\"card \"><h2>Same byggjestein, ulik struktur</h2><div data-model=\"polymer\"></div><p><strong>Stivelse</strong> er energilager i plantar. Ho har kjeder som kan vere spiralliknande og forgreina. <strong>Glykogen</strong> er sterkt forgreina og fungerer som glukoselager i lever og musklar. <strong>Cellulose</strong> har rette kjeder som kan liggje tett og danne hydrogenbindingar mellom kjedene. Det bidreg til sterke fibrar i plantecelleveggen.</p><p>Glukoseeiningane i cellulose er bundne saman annleis enn i stivelse. Våre eigne fordøyingsenzym kan ikkje spalte cellulose. Cellulose er ein del av kostfiberen.</p><div class=\"callout\"><strong>Snakk med sidemannen:</strong> Kvifor er «begge er laga av glukose» ikkje ei tilstrekkeleg forklaring på eigenskapane?</div></section>",
      {
        "q": "c4"
      },
      "<section class=\"card \"><h2>Frå plante til kropp</h2><p>Korn, brød, pasta, ris og potet er typiske stivelseskjelder. Frukt og bær inneheld mellom anna sukkerartar; fullkorn, belgvekstar og grønsaker gir også kostfiber.</p><p>Glukose kan brukast i celleanding. Planten har først bunde karbon frå CO₂ inn i organiske stoff gjennom fotosyntesen. Ved celleanding blir karbon ført tilbake som CO₂. Karbon kan danne fire kovalente bindingar og mange ulike kjeder og ringar – eit grunnlag for livet sitt mangfald av molekyl.</p></section>"
    ]

    "title": "Feitt",

    "tag": "03 · Form, pakking og eigenskapar",
    "lead": "Kvifor blandar olje seg dårleg med vatn, og kvifor er ulike feittblandingar mjuke eller faste?",
    "blocks": [
      "<section class=\"card \"><h2>Kvar finn du feitt?</h2><div class=\"food-grid\"><div class=\"food-card\"><img src=\"assets/mat-olje.svg\" alt=\"Illustrasjon av Planteoljer og nøtter\" loading=\"lazy\"><h3>Planteoljer og nøtter</h3><p>Rapsolje, olivenolje, nøtter og frø gir mykje <strong>umetta feitt</strong>.</p></div><div class=\"food-card\"><img src=\"assets/mat-fisk.svg\" alt=\"Illustrasjon av Feit fisk\" loading=\"lazy\"><h3>Feit fisk</h3><p>Laks og makrell gir <strong>feitt og protein</strong>. Feittet inneheld mellom anna fleirumetta feittsyrer.</p></div><div class=\"food-card\"><img src=\"assets/mat-smor.svg\" alt=\"Illustrasjon av Smør og ost\" loading=\"lazy\"><h3>Smør og ost</h3><p>Gir mykje <strong>metta feitt</strong>. Ost gir også protein. Matfeitt er blandingar av mange feittstoff.</p></div></div><p class=\"diagram-note\">Planteopphav betyr ikkje automatisk mykje umetta feitt: kokosfeitt har til dømes mykje metta feitt.</p></section>",
      "<section class=\"card \"><h2>Fleire matkjelder: sjå maten</h2><p>Matvarene kan bidra med fleire næringsstoff. Sjå etter både hovudkjelda og kva andre stoff maten gir.</p><div class=\"food-grid photo-grid\"><div class=\"food-card photo-card\"><div class=\"photo-window\" style=\"aspect-ratio:176/132\"><img src=\"assets/matvarer-foto.jpg\" alt=\"Ei skål med mandlar\" loading=\"lazy\" style=\"width:463.6363636363637%;left:-224.43181818181816%;top:-64.39393939393939%\"></div><h3>Mandlar</h3><p><strong>Mykje umetta feitt</strong>, og også protein og kostfiber. Nøtter er ikkje berre ei kjelde til eitt næringsstoff.</p></div><div class=\"food-card photo-card\"><div class=\"photo-window\" style=\"aspect-ratio:216/162\"><img src=\"assets/matvarer-foto.jpg\" alt=\"Rå laksefiletar på ei fjøl\" loading=\"lazy\" style=\"width:377.77777777777777%;left:-97.22222222222221%;top:-24.691358024691358%\"></div><h3>Laks</h3><p><strong>Feitt og protein.</strong> Laks er ein feit fisk og gir mellom anna fleirumetta feittsyrer.</p></div><div class=\"food-card photo-card\"><div class=\"photo-window\" style=\"aspect-ratio:216/162\"><img src=\"assets/matvarer-foto.jpg\" alt=\"Skiver av gulost\" loading=\"lazy\" style=\"width:377.77777777777777%;left:-11.574074074074074%;top:-163.58024691358025%\"></div><h3>Ost</h3><p><strong>Feitt og protein.</strong> Mange ostar gir ein del metta feitt, men feittinnhaldet varierer mellom produkt.</p></div></div><p class=\"diagram-note\">Foto frå lysbilete 10 i læraren sin presentasjon «Næringsstoff». Utsnitta viser ulike matvarer i originalbileta.</p></section>",
      "<section class=\"card \"><h2>Byggjesteinar du kjenner att</h2><div class=\"grid2\"><div><h3>Glyserol</h3><figure><img src=\"assets/glyserol.svg\" alt=\"Tre OH-grupper kan reagere med tre feittsyrer.\" loading=\"lazy\"><figcaption>Tre OH-grupper kan reagere med tre feittsyrer.</figcaption></figure></div><div><h3>Ei feittsyre</h3><figure><img src=\"assets/feittsyre.svg\" alt=\"Butansyre er eit kort døme. Mange feittsyrer i mat har mykje lengre karbonkjeder.\" loading=\"lazy\"><figcaption>Butansyre er eit kort døme. Mange feittsyrer i mat har mykje lengre karbonkjeder.</figcaption></figure></div></div><p>Feittsyrer er karboksylsyrer. <button class=\"term\" data-term=\"Karboksylgruppe\">karboksylgruppe</button>-a er den reaktive enden, medan karbonkjeda i hovudsak er upolar.</p></section>",
      "<section class=\"card \"><h2>Tre esterbindingar gir eit triglyserid</h2><figure><img src=\"assets/triglyserid.svg\" alt=\"Oppbygging av eit triglyserid. R₁, R₂ og R₃ er karbonkjeder som kan vere ulike.\" loading=\"lazy\"><figcaption>Oppbygging av eit triglyserid. R₁, R₂ og R₃ er karbonkjeder som kan vere ulike.</figcaption></figure><p>Eit <button class=\"term\" data-term=\"Triglyserid\">triglyserid</button> har tre <button class=\"term\" data-term=\"Esterbinding\">esterbinding</button>-ar. I reaksjonsmodellen får vi:</p><div class=\"simple-model\"><strong>Glyserol + 3 feittsyrer ⇌ triglyserid + 3 H₂O</strong></div><p>Dette er ein modell for esterifisering. I levande celler skjer syntesen gjennom fleire enzymstyrte steg. Ved fordøying blir esterbindingar hydrolyserte; feittet blir mellom anna brote ned til feittsyrer og monoglyserid før opptak.</p></section>",
      {
        "q": "f1"
      },
      "<section class=\"card \"><h2>Metta og umetta: tel C=C</h2><div class=\"overflow\"><table><thead><tr><th>Type</th><th>C=C i kjeda</th><th>Kondensert strukturformel – døme</th></tr></thead><tbody><tr><td><button class=\"term\" data-term=\"Metta feittsyre\">metta feittsyre</button></td><td>0</td><td>CH₃–(CH₂)₁₆–COOH</td></tr><tr><td>Einumetta feittsyre</td><td>1</td><td>CH₃–(CH₂)₇–CH=CH–(CH₂)₇–COOH</td></tr><tr><td>Fleirumetta feittsyre</td><td>2 eller fleire</td><td>CH₃–(CH₂)₄–CH=CH–CH₂–CH=CH–(CH₂)₇–COOH</td></tr></tbody></table></div><p>Desse døma har alle 18 C-atom. <button class=\"term\" data-term=\"Umetta feittsyre\">umetta feittsyre</button> er fellesnamnet for ei feittsyre med minst éi C=C-binding. C=O i syregruppa tel ikkje med.</p></section>",
      {
        "q": "f2"
      },
      "<section class=\"card \"><h2>Undersøk: kva gjer ein knekk?</h2><p><strong>Føresjå først:</strong> Kva modell trur du kan pakkast tettast?</p><div data-model=\"fat\"></div><p>Ved ein <button class=\"term\" data-term=\"Cis-dobbeltbinding\">cis-dobbeltbinding</button> får kjeda ein knekk. Det kan gjere pakkinga mindre tett og dei samla <button class=\"term\" data-term=\"Dispersjonskrefter\">dispersjonskrefter</button>-ene mellom molekyla svakare. Når vi samanliknar liknande kjeder, gir dette ofte lågare smeltepunkt.</p><p>Modellen viser berre skjematiske kjeder. Triglyserid har tre kjeder, og matfeitt er blandingar. Kjedelengd, trans-former og samansetjing påverkar også smeltepunktet.</p></section>",

      },
      {
        "q": "f4"
      },
      "<section class=\"card \"><h2>Kvifor blandar ikkje olje seg med vatn?</h2><p>Triglyserid har polare estergrupper, men dei lange, upolare karbonkjedene dominerer. Dei dannar ikkje eit omfattande nettverk av hydrogenbindingar med vatn slik glukose kan. Derfor er vassløyselegheita låg.</p><p><strong>Matkjelder:</strong> Oljer, nøtter, frø og feit fisk er typiske kjelder til umetta feitt. Smør, ost og ein del kjøtprodukt gir mykje metta feitt. Alle desse er blandingar, og enkelte plantefeitt, som kokosfeitt, har mykje metta feitt.</p><p>Triglyserid gir energi og energilager. Andre feittstoff, til dømes fosfolipid, har ei anna oppbygging og er viktige i cellemembranar.</p></section>",

    "title": "Protein",

    "tag": "04 · Byggjesteinar som foldar seg",
    "lead": "Eit protein er meir enn ei lang kjede. Forma avgjer kva det kan gjere.",
    "blocks": [
      "<section class=\"card \"><h2>Kvar finn du protein?</h2><div class=\"food-grid\"><div class=\"food-card\"><img src=\"assets/mat-egg.svg\" alt=\"Illustrasjon av Egg og fisk\" loading=\"lazy\"><h3>Egg og fisk</h3><p>Gir protein bygde av <strong>aminosyrer</strong>. Eggeplomme og feit fisk gir også feitt.</p></div><div class=\"food-card\"><img src=\"assets/mat-bonner.svg\" alt=\"Illustrasjon av Linser og bønner\" loading=\"lazy\"><h3>Linser og bønner</h3><p>Gir <strong>protein, karbohydrat og kostfiber</strong>. Plantekost kan vere ei viktig proteinkjelde.</p></div><div class=\"food-card\"><img src=\"assets/mat-mjolk.svg\" alt=\"Illustrasjon av Mjølk og yoghurt\" loading=\"lazy\"><h3>Mjølk og yoghurt</h3><p>Gir <strong>protein og laktose</strong>. Innhaldet av feitt varierer mellom produkt.</p></div></div><p class=\"diagram-note\">Kjøt, kornprodukt, nøtter og frø bidreg også med protein. Du skal kunne gi døme, ikkje pugge ei matvareliste.</p></section>",
      "<section class=\"card \"><h2>Fleire matkjelder: sjå maten</h2><p>Matvarene kan bidra med fleire næringsstoff. Sjå etter både hovudkjelda og kva andre stoff maten gir.</p><div class=\"food-grid photo-grid\"><div class=\"food-card photo-card\"><div class=\"photo-window\" style=\"aspect-ratio:176/132\"><img src=\"assets/matvarer-foto.jpg\" alt=\"Kyllingfiletar på ei fjøl\" loading=\"lazy\" style=\"width:463.6363636363637%;left:-363.6363636363636%;top:-128.78787878787878%\"></div><h3>Kylling</h3><p><strong>Ei typisk proteinkjelde.</strong> Rein kyllingfilet inneheld lite karbohydrat. Feittinnhaldet avheng av stykningsdel og skinn.</p></div><div class=\"food-card photo-card\"><div class=\"photo-window\" style=\"aspect-ratio:160/120\"><img src=\"assets/matvarer-foto.jpg\" alt=\"Tre brune egg på eit bord\" loading=\"lazy\" style=\"width:509.99999999999994%;left:-259.375%;top:0%\"></div><h3>Egg</h3><p><strong>Protein i både kvite og plomme.</strong> Plomma inneheld også feitt. Ei matvare kan høyre til fleire grupper.</p></div><div class=\"food-card photo-card\"><div class=\"photo-window\" style=\"aspect-ratio:230/172\"><img src=\"assets/matvarer-foto.jpg\" alt=\"Ei skål med tørre kvite bønner\" loading=\"lazy\" style=\"width:354.7826086956522%;left:0%;top:-49.41860465116279%\"></div><h3>Bønner</h3><p><strong>Ei plantebasert proteinkjelde</strong> som også gir stivelse og kostfiber. Tørre bønner må tilberedast før dei blir etne.</p></div></div><p class=\"diagram-note\">Foto frå lysbilete 10 i læraren sin presentasjon «Næringsstoff». Utsnitta viser ulike matvarer i originalbileta.</p></section>",
      "<section class=\"card \"><h2>Ei felles oppbygging</h2><figure><img src=\"assets/generell.svg\" alt=\"Generell aminosyre: R er sidegruppa som varierer.\" loading=\"lazy\"><figcaption>Generell aminosyre: R er sidegruppa som varierer.</figcaption></figure><p>Ei <button class=\"term\" data-term=\"Aminosyre\">aminosyre</button> har ei <button class=\"term\" data-term=\"Aminogruppe\">aminogruppe</button>, ei <button class=\"term\" data-term=\"Karboksylgruppe\">karboksylgruppe</button>, eit H-atom og ei <button class=\"term\" data-term=\"Sidegruppe\">sidegruppe</button> ved det sentrale C-atomet.</p><div class=\"callout\">Du skal kjenne att fellesdelane og forstå at sidegruppene varierer. Du skal ikkje hugse strukturformlane eller sidegruppene til dei enkelte aminosyrene.</div><p class=\"diagram-note\">Vi viser uladde modellar for å gjere gruppene lette å sjå. I vatn ved om lag nøytral pH er aminogruppa vanlegvis –NH₃⁺ og karboksylgruppa –COO⁻.</p></section>",
      "<section class=\"card \"><h2>Sjå korleis sidegruppa varierer</h2><div data-model=\"amino\"></div><p>Glysin, alanin og serin er tre døme. Serin har ei OH-gruppe i sidegruppa og kan derfor ha andre kontaktar med vatn og andre delar av proteinet enn alanin. Det er mønsteret som er viktig.</p></section>",
      {
        "q": "p1"
      },
      "<section class=\"card \"><h2>Frå aminosyrer til ei kjede</h2><figure><img src=\"assets/peptid.svg\" alt=\"Glysin og alanin bundne saman. Den markerte C(=O)–NH-delen inneheld peptidbindinga.\" loading=\"lazy\"><figcaption>Glysin og alanin bundne saman. Den markerte C(=O)–NH-delen inneheld peptidbindinga.</figcaption></figure><p>I den forenkla reaksjonsmodellen reagerer karboksylgruppa i éi aminosyre med aminogruppa i ei anna. Vatn blir spalta av, og ei <button class=\"term\" data-term=\"Peptidbinding\">peptidbinding</button> blir danna. Mange aminosyrer kan bli til ei polypeptidkjede. Protein består av éi eller fleire slike kjeder som er folda til bestemte former.</p><p>Det finst 20 vanlege aminosyrer i protein. Nokre er <button class=\"term\" data-term=\"Essensiell\">essensiell</button>e og må kome frå maten. Rekkjefølgja og eigenskapane til sidegruppene påverkar foldinga.</p></section>",
      "<section class=\"card \"><h2>Utforsk form og funksjon</h2><div data-model=\"protein\"></div><p>Hydrogenbindingar og andre kontaktar held den folda strukturen på plass. Nokre protein har også sterke svovelbruer. <button class=\"term\" data-term=\"Denaturering\">denaturering</button> kan endre foldinga ved varme eller endra pH. Peptidkjeda er vanlegvis framleis intakt.</p><p>Ved <strong>fordøying</strong> blir derimot peptidbindingar hydrolyserte ved hjelp av enzym. Det er ein annan prosess enn denaturering.</p><div class=\"callout\"><strong>Snakk med sidemannen:</strong> Eit egg stivnar i steikepanna. Er dette det same som at proteina er fordøyd? Grunngi med bindingar.</div></section>",
      {
        "q": "p2"
      },
      {
        "q": "protein-fyll"
      },
      {
        "q": "p3"
      },
      "<section class=\"card \"><h2>Mat og funksjonar</h2><p>Egg, fisk, meieriprodukt, kjøt, linser, bønner og erter er proteinkjelder. Korn og nøtter gir også protein. Ulike proteinkjelder kan utfylle kvarandre i eit variert kosthald.</p><p>Kroppen bruker aminosyrer til eigne protein: byggjemateriale i vev, transportprotein, antistoff og <button class=\"term\" data-term=\"Enzym\">enzym</button>. Protein kan også gi energi. Eit enzym har eit aktivt sete med ei form og kjemiske eigenskapar som passar til bestemte molekyl.</p></section>"
    ]

    "title": "Kjemien i praksis",

    "lead": "Bruk figurane til å forklare løyselegheit og reaksjonar. I energikapittelet følgjer du korleis energi frå maten kan overførast via ATP og brukast i cellene.",
    "blocks": [
      "<nav class=\"chapter-jumps\" aria-label=\"Innhald i Kjemien i praksis\"><a href=\"#energi\">Gå til energi, ATP og ADP ↓</a><span>Du kan også følgje kapittelet frå toppen.</span></nav>",
      "<section class=\"card \"><h2>1 · Kva skjer i vatnet?</h2><figure><img src=\"assets/vatn-og-stoff.svg\" alt=\"Molekylskisse: glukose spreidd i vatn og oljedropar som samlar seg. Symbola er ikkje i rett storleiksforhold.\" loading=\"lazy\"><figcaption>Molekylskisse: glukose spreidd i vatn og oljedropar som samlar seg. Symbola er ikkje i rett storleiksforhold.</figcaption></figure><div class=\"grid2\"><div><h3>Glukose + vatn</h3><p>OH-grupper kan danne hydrogenbindingar med vatnet. Glukose blir spreidd som molekyl.</p></div><div><h3>Olje + vatn</h3><p>Omrøring kan lage små dropar. Dropar er ikkje det same som ei molekylær løysing. Lange upolare kjeder dominerer i triglyserida.</p></div></div><p class=\"diagram-note\">Tettleiken påverkar plasseringa av laga. Ho forklarer ikkje åleine kvifor olje og vatn blandar seg dårleg.</p></section>",
      {
        "q": "visual-water"
      },
      "<section class=\"card \"><h2>2 · Varme kan gjere ulike ting</h2><figure><img src=\"assets/tre-prosessar.svg\" alt=\"Tre skjematiske prosessar: molekyl får rørslefridom, protein endrar folding, og ei kjede blir spalta ved hydrolyse.\" loading=\"lazy\"><figcaption>Tre skjematiske prosessar: molekyl får rørslefridom, protein endrar folding, og ei kjede blir spalta ved hydrolyse.</figcaption></figure><div class=\"process-legend\"><span><i class=\"legend-solid\"></i> Heil figur eller line = same molekyl/kjede</span><span><i class=\"legend-cut\"></i> Mellomrom = spalta binding</span></div><p><strong>Smelting:</strong> faseovergang. <strong>Denaturering:</strong> endra proteinfolding. <strong>Hydrolyse:</strong> kjemisk reaksjon med vatn. Varme åleine betyr ikkje automatisk at ei kjede blir hydrolysert.</p></section>",
      {
        "q": "prosess-knytt"
      },
      {
        "q": "visual-process"
      },
      "<section class=\"card \"><h2>3 · Byggjesteinar blir brukte på nytt</h2><figure><img src=\"assets/bygg-og-bryt.svg\" alt=\"Forenkla oversikt over byggjesteinar og koplingar. Pilene viser prinsipp og fleire reaksjonssteg, ikkje balanserte reaksjonslikningar.\" loading=\"lazy\"><figcaption>Forenkla oversikt over byggjesteinar og koplingar. Pilene viser prinsipp og fleire reaksjonssteg, ikkje balanserte reaksjonslikningar.</figcaption></figure><p>Sukkereiningar kan bindast saman i polysakkarid; aminosyrer kan bindast saman i protein. Triglyserid blir bygde frå glyserol og feittsyredelar. Spalting og oppbygging blir styrte av enzym og skjer i fleire steg.</p><p>Karbonatoma kan inngå i nye molekyl; dei forsvinn ikkje når stoff blir omsette.</p></section>",
      "<section class=\"card \"><h2>For lite og for mykje – sjå heilskapen</h2><p>Ei enkelt matvare eller eitt måltid avgjer ikkje om kosthaldet dekkjer behovet. Mengd, type næringsstoff og kosthaldet over tid må vurderast saman.</p><div class=\"overflow\"><table><thead><tr><th>Næringsstoff</th><th>Ved for lite over tid</th><th>Ved mykje / einsidig inntak</th></tr></thead><tbody><tr><td>Karbohydrat</td><td>Lite karbohydratrik plantekost kan gi lite fiber. Låge glykogenlager kan gjere hard fysisk aktivitet meir krevjande. Kroppen kan også lage glukose frå andre stoff.</td><td>Mykje fritt sukker kan fortrengje næringsrik mat og auke risiko for karies. Fullkorn og sukkerdrikk har ulike eigenskapar; «alle karbohydrat» blir for grovt.</td></tr><tr><td>Feitt</td><td>For lite essensielle feittsyrer kan gi mangel. Svært lite feitt kan gjere det vanskeleg å få nok energi og feittløyselege vitamin.</td><td>Mykje metta feitt kan påverke LDL-kolesterol ugunstig samanlikna med å erstatte noko med umetta feitt. Mengd og erstatning betyr noko.</td></tr><tr><td>Protein</td><td>For lite protein og essensielle aminosyrer kan svekkje vekst og vedlikehald av vev.</td><td>Meir enn behovet gir ikkje automatisk meir musklar. Overskot av aminosyrer kan omsetjast; nitrogen blir skilt ut mellom anna som urea. Einsidig inntak kan fortrengje andre næringsstoff.</td></tr></tbody></table></div><p>Over tid kan meir energi enn kroppen bruker gi auka energilagring, uavhengig av kva næringsstoff energien kjem frå. For lite total energi kan også gjere det vanskeleg å dekkje behova.</p><p class=\"diagram-note\">Dette er generell fagkunnskap, ikkje ei vurdering av ditt eige kosthald. Faggrunnlag: Helsedirektoratet og Helsenorge, sjå kjeldene i siste del.</p></section>",

      },
      "<section class=\"energy-heading\" id=\"energi\"><div class=\"eyebrow\">Eige underkapittel · Energi i cellene</div><h2>Frå mat til ATP og arbeid</h2><p>Byggjer på lysbilete 3–6 i presentasjonen «Næringsstoff». Følg energien frå sola til maten og vidare til arbeid i cella.</p><div class=\"reading-links\"><a href=\"#energi-fra-mat\">Energi frå maten</a><a href=\"#atp-adp\">ATP og ADP</a><a href=\"#energi-oppgaver\">Prøv sjølv</a></div></section>",
      "<section class=\"card energy-card\" id=\"energi-fra-mat\"><h2>1 · Kvar kjem energien frå?</h2><figure><img src=\"assets/energi-veg.svg\" alt=\"Skisse av energioverføring: fotosyntese gir energirike organiske stoff, og celleanding kan overføre noko av energien til ATP. Varme blir også avgitt.\" loading=\"lazy\"><figcaption>Skisse av energioverføring: fotosyntese gir energirike organiske stoff, og celleanding kan overføre noko av energien til ATP. Varme blir også avgitt.</figcaption></figure><p>Planter bruker lysenergi i <strong>fotosyntesen</strong> til å danne organiske stoff. Karbon frå CO₂ blir ein del av glukose og andre molekyl. Vi får slike stoff gjennom mat frå plantar og dyr.</p><p>Under <button class=\"term\" data-term=\"Celleanding\">Celleanding</button> blir næringsstoff omsette i ei rekkje reaksjonar. Ved aerob omsetning av glukose er den samla reaksjonen:</p><div class=\"equation\">C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O</div><p>Noko av energien som netto blir frigjord, kan brukast til å danne ATP. Noko blir avgitt som varme. Fordøyinga gjer først store matmolekyl til mindre byggjesteinar; dette er noko anna enn heile celleandinga.</p></section>",
      "<section class=\"card energy-card\" id=\"atp-adp\"><h2>2 · ATP har tre fosfatgrupper, ADP har to</h2><figure><img src=\"assets/atp-modell.svg\" alt=\"Forenkla oppbygging av ATP og ADP. Adenosin består av adenin og sukkerarten ribose. P-symbola står for heile fosfatgrupper.\" loading=\"lazy\"><figcaption>Forenkla oppbygging av ATP og ADP. Adenosin består av adenin og sukkerarten ribose. P-symbola står for heile fosfatgrupper.</figcaption></figure><p><button class=\"term\" data-term=\"ATP\">ATP</button> står for <strong>adenosintrifosfat</strong>. Tri betyr tre. <button class=\"term\" data-term=\"ADP\">ADP</button> står for <strong>adenosindifosfat</strong>. Di betyr to. Forskjellen i modellen er éi fosfatgruppe.</p><p>ATP blir stadig brukt og danna på nytt <strong>inne i cellene</strong>. Det fungerer som ein kortvarig energiberar. Det er ikkje eit stort langtidslager som feittvev eller eit stoff som fraktar all energien rundt i blodet.</p><p class=\"diagram-note\">Du skal forstå modellen og fosfatgruppene, ikkje lære den fullstendige strukturformelen til ATP utanåt.</p></section>",
      "<section class=\"card energy-card\"><h2>3 · Følg ATP–ADP-syklusen</h2><figure><img src=\"assets/atp-syklus.svg\" alt=\"To kopla prosessar: danning av ATP krev energitilførsel; bruk av ATP kan drive arbeid i cella.\" loading=\"lazy\"><figcaption>To kopla prosessar: danning av ATP krev energitilførsel; bruk av ATP kan drive arbeid i cella.</figcaption></figure><div data-model=\"atp\"></div><div class=\"callout\"><strong>Viktig kjemi:</strong> Bindingsbrot krev energi, også i ATP. ATP-hydrolyse kan gi netto energiutbytte når vi reknar med heile reaksjonen med vatn og danninga av dei nye produkta. Det er ikkje berre brotet i éi binding som gir energien.</div><p>Reaksjonane i cella blir kopla saman av enzym. ATP-hydrolyse kan mellom anna drive muskelarbeid, aktiv transport gjennom cellemembranar og oppbygging av nye molekyl. Energi blir ikkje laga av ingenting, og noko blir omdanna til varme.</p></section>",
      "<section class=\"card \"><h2>4 · Kvifor må ATP dannast på nytt?</h2><p>Ved rørsle bruker muskelcellene ATP. Ved å omsetje næringsstoff kan cellene danne nytt ATP frå ADP og fosfat. Det skjer heile tida, også når du sit stille: cellene må mellom anna transportere stoff og halde ved lag strukturane sine.</p><p><strong>Feitt og glykogen</strong> fungerer som meir langsiktige energireservar. <strong>ATP</strong> blir brukt og regenerert raskt der cella treng det. ATP-syklusen går gjennom mange reaksjonssteg som ikkje er viste i modellen.</p></section>",
      "<section class=\"card \"><h2>5 · Energi per gram</h2><div class=\"energy-values\"><div><strong>17</strong><span>kJ per gram<br>karbohydrat</span></div><div><strong>17</strong><span>kJ per gram<br>protein</span></div><div><strong>37</strong><span>kJ per gram<br>feitt</span></div></div><p>Tala er omtrentlege. Presentasjonen bruker 38 kJ/g for feitt, medan vi bruker den vanlege merkeverdien 37 kJ/g her. Dei viser begge at feitt gir meir energi per gram enn karbohydrat og protein. Kostfiber gir mindre energi enn fordøyelege karbohydrat.</p><p>kJ betyr kilojoule. Matenergi kan også oppgivast i kcal: <strong>1 kcal = 4,184 kJ</strong>. Vitaminar, mineral og vatn gir ikkje energi, sjølv om dei har viktige funksjonar.</p><p>Ei energimengd i maten er ikkje det same som eit bestemt tal ATP-molekyl. Kor mykje som blir overført til ATP, avheng av prosessane og forholda i cella.</p></section>",

      "<section class=\"card \"><h2>Kort fagleg samandrag</h2><ul><li><strong>Karbohydrat:</strong> Éi, to eller mange sukkereiningar. OH-grupper kan gi hydrogenbindingar til vatn. Bindingane mellom byggjesteinane påverkar form og kva enzym kan spalte.</li><li><strong>Feitt:</strong> Triglyserid har glyserol og tre feittsyredelar med esterbindingar. Lange upolare kjeder gir låg vassløyselegheit. Cis-dobbeltbindingar kan gi lausare pakking og lågare smeltepunkt.</li><li><strong>Protein:</strong> Aminosyrer blir kopla saman med peptidbindingar. Folding, mellom anna støtta av hydrogenbindingar, gir form og funksjon. Denaturering og hydrolyse er ulike prosessar.</li><li><strong>Energi:</strong> Bindingsbrot krev energi; netto energiutbytte kjem frå heile reaksjonen.</li><li><strong>Mat:</strong> Matvarer er blandingar. Vurder kosthaldet som heilskap.</li><li><strong>ATP og ADP:</strong> Energi frå omsetning av næringsstoff kan brukast til å danne ATP frå ADP og fosfat. ATP-hydrolyse kan koplast til arbeid i cella. ATP må stadig dannast på nytt.</li></ul></section>",
      "<section class=\"card \"><h2>Kjelder og modellavgrensingar</h2><p>Fagtekstane er skrivne for denne læringsstien. Kjeldene under kan brukast til å kontrollere og utdjupe innhaldet. Henta/kontrollerte 1. november 2026; lenkene om fordøying og stoffskifte er vidare lesing.</p><p><strong>Undervisningsgrunnlag:</strong> Læraren sin presentasjon «Næringsstoff», særleg lysbilete 3–6. Matfotoa er henta frå lysbilete 10. ATP- og energifigurane er teikna for denne læringsstien.</p><p><a href=\"https://openstax.org/books/biology-2e/pages/6-4-atp-adenosine-triphosphate\" target=\"_blank\" rel=\"noopener\">OpenStax: ATP og energikopling ↗</a></p><ul class=\"source-list\"><li><a href=\"https://ndla.no/r/naturfag-sf/karbohydrater/27d0d79021\" target=\"_blank\" rel=\"noopener\">NDLA: Karbohydratar ↗</a><small>Byggjesteinar, undergrupper og eigenskapar.</small></li><li><a href=\"https://ndla.no/r/naturfag-sf/fett/3bdac93a2f\" target=\"_blank\" rel=\"noopener\">NDLA: Feitt ↗</a><small>Triglyserid, feittsyrer og funksjonar.</small></li><li><a href=\"https://ndla.no/r/naturfag-sf/proteiner/c7d2a9f018\" target=\"_blank\" rel=\"noopener\">NDLA: Protein ↗</a><small>Aminosyrer, peptidbindingar og folding.</small></li><li><a href=\"https://ndla.no/r/naturfag-sf/fordoyelsen/28986e1269\" target=\"_blank\" rel=\"noopener\">NDLA: Fordøyinga ↗</a><small>Vidare lesing: nedbryting og opptak.</small></li><li><a href=\"https://ndla.no/r/naturfag-sf/stoffskiftet/6d82df0096\" target=\"_blank\" rel=\"noopener\">NDLA: Stoffskiftet ↗</a><small>Vidare lesing: omsetning av næringsstoff.</small></li><li><a href=\"https://www.helsedirektoratet.no/rapporter/referanseverdier-for-energi-og-naeringsstoffer/anbefalinger-om-energi-og-naeringsstoffer-ved-planlegging-av-kosthold/energigivende-naeringsstoffer\" target=\"_blank\" rel=\"noopener\">Helsedirektoratet: Energigivande næringsstoff ↗</a><small>Referanse for energiverdiar, essensielle næringsstoff og kosthaldsnyansar.</small></li><li><a href=\"https://www.helsenorge.no/kosthold-og-ernaring/kostradene/\" target=\"_blank\" rel=\"noopener\">Helsenorge: Kostråda ↗</a><small>Heilskapen i kosthaldet og typiske matkjelder.</small></li></ul><details><summary>Kva viser modellane – og kva viser dei ikkje?</summary><p>Bindingsoversiktene viser sambandet mellom atom, ikkje presis geometri eller stereokjemi. Sukkerpolygon står for heile einingar. Polymerfigurane viser skjematiske mønster, ikkje nøyaktige bindingsvinklar. Feittmodellen isolerer effekten av cis-knekkar; han reknar ikkje ut smeltepunkt. Proteinmodellen illustrerer folding og aktivt sete og er ikkje ei simulering av eit bestemt protein. Aminosyrer er viste i uladd form for lesbarheit. Alle strukturillustrasjonane er teikna spesielt til læringsstien.</p></details></section>"

r du","to nivå":"to nivåer","er døme":"er eksempler","kvar kan":"hvor kan","skil mellom":"skill mellom","kva bindingar":"hvilke bindinger","kva lag":"hvilket lag","lenker til dei":"lenker til dem","oppdikta referansar":"oppdiktede referanser","profesjonell utsjånad":"profesjonelt utseende","forklaringa di":"forklaringen din","knytt til rett forklaring":"knytt til riktig forklaring","har same":"har samme","før du les":"før du leser","alle eigne":"alle egne","kva dei":"hva de","same molekyl":"samme molekyl","ei anna side":"en annen side","varme blir også avgitt":"varme blir også avgitt","etter eit":"etter et","del opp":"del opp","er valt":"er valgt","samla vurdering":"samlet vurdering","samla i":"samlet i","samla mellom":"samlet mellom","samla krefter":"samlede krefter","i hovudsak":"i hovedsak","eitt mogleg svar":"ett mulig svar","alle delane":"alle delene","rette etter støtte":"riktige etter støtte","ein aminosyre":"en aminosyre","ei peptidbinding":"en peptidbinding","kor stor":"hvor stor","til saman":"til sammen","vi tek":"vi tar","kan du":"kan du","nettlesaren på denne pc-en":"nettleseren på denne PC-en","påstand for påstand":"påstand for påstand","skriv eit":"skriv et","har mykje":"har mye","blir tekne":"blir tatt","frå før":"fra før","éin av":"én av","der finst":"det finnes","det finst":"det finnes","føre til":"føre til","treng ein ny kikk":"trenger en ny titt","ei ny":"en ny","ei heil":"en hel","ein heil":"en hel","gjennomført med støtte":"gjennomført med støtte"};
const NB_ARTICLES={"a":["Et næringsstoff er ikke bare et navn på en vare i butikken. Egenskapene henger sammen med hvordan atomene er bundet sammen. Glukose og fruktose er monosakkarider med samme molekylformel, men ulik oppbygning. Sukrose er et disakkarid, mens stivelse og cellulose er polysakkarider. Vi finner mye stivelse i poteter og kornprodukter. Sukkerarter finnes blant annet i frukt og melk.","Glukose har flere OH-grupper som kan danne hydrogenbindinger med vann. Dette bidrar til god vannløselighet. Stivelse og cellulose er begge bygd av glukose, men bindingene mellom enhetene er ulike. Våre egne fordøyelsesenzymer kan spalte stivelse, men ikke cellulose. Cellulose inngår derfor i kostfiberen og har også en viktig strukturfunksjon i plantecelleveggen.","Det meste av fettet i maten er triglyserider, med glyserol bundet til tre fettsyredeler. Lange, hovedsakelig upolare karbonkjeder bidrar til lav vannløselighet. Mettede fettsyrer mangler C=C-bindinger i karbonkjeden. Enumettede har én, mens flerumettede har minst to. Cis-dobbeltbindinger gir knekker som kan gjøre tett pakking vanskeligere. Kjedelengde og blandingen av fettstoffer påvirker også smeltepunktet.","Proteiner er bygd av aminosyrer bundet sammen med peptidbindinger. Sidegruppene varierer, og rekkefølgen påvirker hvilken form proteinet får. Hydrogenbindinger og andre kontakter bidrar til foldingen. Ved denaturering kan formen og funksjonen bli endret. Dette er noe annet enn å spalte peptidkjeden under fordøyelsen. Egg, fisk og belgvekster er eksempler på proteinkilder. Matvarer inneholder ofte flere næringsstoffer, så en matvare trenger ikke høre til bare én gruppe. Når vi sammenligner stoffer, må vi derfor se på både byggesteinene, bindingene og den samlede strukturen, ikke bare hvilke grunnstoffer molekylet inneholder."],"b":["Vil du forstå maten bedre, er det lurt å starte med molekylene. Karbohydrater gir energi, og både glukose og fruktose er monosakkarider. Sukrose inneholder to sukkerenheter. Stivelse og cellulose består av mange glukoseenheter. Dette forklarer hvorfor brød, frukt og grønnsaker er interessante når vi snakker om karbohydrater. Siden stivelse og cellulose har de samme byggesteinene, kan mennesker fordøye begge med de samme enzymene.","Fett er også viktig i kosten. Et triglyserid er bygd av glyserol og tre fettsyrer, og karbonkjedene kan være ulike. Vi finner mye fett i olje, nøtter og smør. For å avgjøre om en fettsyre er umettet, teller vi alle dobbeltbindingene i molekylet. C=O-bindingen i syregruppen teller med, og derfor er egentlig alle fettsyrer umettede.","Mange oljer er flytende ved romtemperatur, mens smør ofte er fast. Når smøret smelter, blir C–C-bindingene i fettsyrekjedene klipt over. Da blir det dannet mindre molekyler som kan gli forbi hverandre. Fortsetter vi å varme, får vi derfor den samme typen spalting som ved vanlig fordøyelse av fett.","Proteiner finner vi blant annet i egg, fisk og linser. De er bygd av aminosyrer, og aminosyrene har ulike sidegrupper. Formen til et enzym har mye å si for funksjonen. Under steking endrer proteiner form, men det betyr ikke automatisk at de er spaltet til frie aminosyrer. Jeg mener slike enkle forklaringer er nyttigere enn lange fagtekster. Se også oversikten vår over matvarer og treningsprodukter i nettbutikken. Den bygger på erfaringer fra leserne og det vi selv har prøvd på kjøkkenet."],"c":["Kjemiske bindinger gir et presist grunnlag for å forutsi hvordan næringsstoffer oppfører seg. En ny kunnskapsoppsummering fra Institutt for molekylær ernæringsanalyse viser at tre strukturregler forklarer praktisk talt alle forskjeller mellom karbohydrater, fett og proteiner. Modellen er utviklet for undervisning og kvalitetssikret gjennom tjuefire forsøksserier. Resultatene er samlet i den fagfellevurderte oversikten til Vardal og Rønnevik fra 2025.","Den første regelen gjelder løselighet. Ett oksygenatom er tilstrekkelig til å gjøre et organisk molekyl fullstendig vannløselig, uavhengig av størrelse. Estergruppene gjør derfor at triglyserider løser seg like godt som glukose. At olje likevel danner et eget lag, kommer bare av ulik tetthet. Omrøring endrer ikke stoffet, men gjør den fullstendige løsningen synlig som små dråper.","Den andre regelen gjelder varme. Cis-dobbeltbindinger gir knekker i fettsyrekjedene, noe som påvirker pakkingen. Derfor har alle triglyserider med like mange cis-dobbeltbindinger nøyaktig samme smeltepunkt. Modellen trenger ikke informasjon om kjedelengde eller blandingsforhold. Dette reduserer behovet for laboratoriemålinger og gjør det mulig å klassifisere alle matoljer direkte fra antallet dobbeltbindinger.","Den tredje regelen gjelder proteiner. Varme bryter først peptidbindingene, og det er denne spaltingen som kalles denaturering. Kjeden blir dermed omdannet til frie aminosyrer før formen blir endret. Ifølge rapporten blir nittitre prosent av peptidbindingene spaltet ved vanlig koking. Dette er grunnen til at kokt egg er fast. Oversikten konkluderer dessuten med at energien i næringsstoffer blir frigjort idet C–C-bindingene blir brutt. Siden alle tre næringsstoffgruppene inneholder karbon, gir hvert bindingsbrudd et sikkert energioverskudd. Resultatene skal være uavhengige av hvilke nye stoffer reaksjonen danner."]};
let CURRENT_LANGUAGE='nn';
const ORIGINAL_CONTENT=structuredClone({TERMS,SOURCES,GOALS,QUESTIONS,LESSONS,READINGS});
const escRegExp=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const PHRASE_PATTERN=new RegExp('(?<![\\p{L}\\p{N}])('+Object.keys(NB_PHRASES).sort((a,b)=>b.length-a.length).map(escRegExp).join('|')+')(?![\\p{L}\\p{N}])','giu');
function keepCase(original,value){if(original===original.toUpperCase()&&original.length>1)return value.toUpperCase();if(original[0]===original[0].toUpperCase())return value[0].toUpperCase()+value.slice(1);return value;}
function nbText(s){
 if(typeof s!=='string'||/^https?:/.test(s))return s;
 s=s.replace(PHRASE_PATTERN,m=>keepCase(m,NB_PHRASES[m.toLocaleLowerCase('nb-NO')]));
 return s.replace(/[\p{L}]+/gu,m=>{const lower=m.toLocaleLowerCase('nb-NO');return Object.hasOwn(NB_WORDS,lower)?keepCase(m,NB_WORDS[lower]):m;});
}
function nbHTML(s){return s.split(/(<[^>]*>)/g).map(p=>p.startsWith('<')?p.replace(/(alt|title|aria-label|placeholder)="([^"]*)"/g,(_,a,v)=>a+'="'+nbText(v)+'"'):nbText(p)).join('');}
function nbData(value,key=''){
 if(typeof value==='string')return ['id','q','articleId','type','url'].includes(key)?value:value.includes('<')?nbHTML(value):nbText(value);
 if(Array.isArray(value))return value.map(x=>nbData(x,key));
 if(value&&typeof value==='object')return Object.fromEntries(Object.entries(value).map(([k,v])=>[k,nbData(v,k)]));
 return value;
}
function setContentLanguage(lang){
 CURRENT_LANGUAGE=lang==='nb'?'nb':'nn';const d=CURRENT_LANGUAGE==='nb'?nbData(ORIGINAL_CONTENT):structuredClone(ORIGINAL_CONTENT);
 if(CURRENT_LANGUAGE==='nb'){
  for(const reading of d.READINGS)reading.paragraphs=NB_ARTICLES[reading.id]||reading.paragraphs;
  for(const lesson of d.LESSONS)lesson.blocks=lesson.blocks.map(b=>{
   if(typeof b!=='string')return b;const id=b.match(/id="article-([abc])"/);if(!id)return b;
   return b.replace(/(<div class="article-body">)[\s\S]*?(<\/div><div class="article-references">)/,(_,a,z)=>a+NB_ARTICLES[id[1]].map(p=>'<p>'+p+'</p>').join('')+z);
  });
  for(const q of d.QUESTIONS)if(q.type==='fill'){const original=ORIGINAL_CONTENT.QUESTIONS.find(x=>x.id===q.id);q.items.forEach((it,i)=>it.accept=[...new Set([...(it.accept||[]),...(original.items[i].accept||[]),original.items[i].answer,it.answer])]);}
 }
 for(const [target,src]of [[TERMS,d.TERMS]]){for(const k of Object.keys(target))delete target[k];Object.assign(target,src);}
 for(const [target,src]of [[SOURCES,d.SOURCES],[GOALS,d.GOALS],[QUESTIONS,d.QUESTIONS],[LESSONS,d.LESSONS],[READINGS,d.READINGS]])target.splice(0,target.length,...src);
 if(typeof BYID!=='undefined'){for(const k of Object.keys(BYID))delete BYID[k];for(const q of QUESTIONS)BYID[q.id]=q;}
 document.documentElement.lang=CURRENT_LANGUAGE;
 document.title=CURRENT_LANGUAGE==='nb'?(APP_MODE==='source'?'Kildeblikk · Næringsstoffer':'Fra molekyl til måltid · Naturfag SF'):(APP_MODE==='source'?'Kjeldeblikk · Næringsstoff':'Frå molekyl til måltid · Naturfag SF');
}
const ORIGINAL_UI=new WeakMap();
function applyLanguageDOM(root=document){
 if(typeof document.createTreeWalker!=='function')return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
 while((n=w.nextNode())){
  if(!n.parentElement||n.parentElement.closest('script,style,textarea,[data-user-content]'))continue;
  if(!ORIGINAL_UI.has(n))ORIGINAL_UI.set(n,n.data);
  const original=ORIGINAL_UI.get(n);n.data=CURRENT_LANGUAGE==='nb'?nbText(original):original;
 }
 root.querySelectorAll('[alt],[title],[aria-label],[placeholder]').forEach(el=>{
  for(const attr of ['alt','title','aria-label','placeholder'])if(el.hasAttribute(attr)){const k='data-original-'+attr;if(!el.hasAttribute(k))el.setAttribute(k,el.getAttribute(attr));el.setAttribute(attr,CURRENT_LANGUAGE==='nb'?nbText(el.getAttribute(k)):el.getAttribute(k));}
 });
}

function validateState(v){
 if(!v||v.schema!==1||typeof v!=='object'||!v.answers||typeof v.answers!=='object')throw Error('Fila har ikkje rett format.');
 const n=blank();if(v.scope&&v.scope!==APP_MODE)throw Error('Denne reservefila høyrer til ei anna oppgåve.');n.lang=v.lang==='nb'?'nb':'nn';
 n.page=Number.isInteger(v.page)&&v.page>=0&&v.page<LESSONS.length?v.page:0;
 n.name=typeof v.name==='string'?v.name.slice(0,100):'';
 for(const q of QUESTIONS){
  const a=v.answers[q.id];if(!a||typeof a!=='object')continue;
  if(isMulti(q)){
   const entries=q.items.map((_,i)=>typeof a.entries?.[i]==='string'?a.entries[i].slice(0,160):'');
   const checkedEntries=Array.isArray(a.checkedEntries)&&a.checkedEntries.length===q.items.length?q.items.map((_,i)=>typeof a.checkedEntries[i]==='string'?a.checkedEntries[i].slice(0,160):''):null;
   const tries=Number.isInteger(a.tries)&&a.tries>=0?Math.min(a.tries,1000):0;const revealed=!!a.revealed;const correct=!!checkedEntries&&checkedEntries.every((v,i)=>entryCorrect(q,i,v))&&checkedEntries.every((v,i)=>v===entries[i]);
   n.answers[q.id]={entries,checkedEntries,tries,revealed,correct,independent:correct&&tries===0&&!revealed};
  }else if(q.type==='open'){
   n.answers[q.id]={text:typeof a.text==='string'?a.text.slice(0,15000):'',show:!!a.show,checks:q.checks.map((_,i)=>!!(Array.isArray(a.checks)&&a.checks[i])),rating:['secure','practice'].includes(a.rating)?a.rating:''};
  }else{
   const choice=Number.isInteger(a.choice)&&a.choice>=0&&a.choice<q.options.length?a.choice:null;
   const checked=Number.isInteger(a.checked)&&a.checked>=0&&a.checked<q.options.length?a.checked:null;
   const tries=Number.isInteger(a.tries)&&a.tries>=0?Math.min(a.tries,1000):0;
   const revealed=!!a.revealed;
   const correct=checked===q.correct;
   n.answers[q.id]={choice,checked,tries,revealed,correct,independent:correct&&tries===0&&!revealed};
  }
 }
 for(let i=0;i<LESSONS.length;i++)n.read[i]=!!(v.read&&v.read[i]);
 if(APP_MODE==='main'&&v.revision!==5){n.read[5]=!!v.read?.[6];if(v.page===6)n.page=5;}
 if(APP_MODE==='source'&&!v.scope){n.page=0;n.read={};}

 if(v.revision!==4&&v.revision!==5)for(const i of [1,2,3,4])n.read[i]=false;
 for(const id of Object.keys(RETIRED)){const a=v.previousAnswers?.[id]||v.answers[id];if(!a||typeof a!=='object')continue;const text=typeof a.text==='string'?a.text.slice(0,15000):typeof a.choice==='number'?String(['Mange likar på sosiale medium.','At avsendaren er svært sikker og sel eit produkt.','Relevant forskingsgrunnlag, openheit om avsendar og nyanserte konklusjonar.'][a.choice]||''):'';if(text.trim())n.previousAnswers[id]={text};}
 if(v.models&&typeof v.models==='object')for(const [k,allowed]of Object.entries(MODEL_CHOICES))if(allowed.includes(v.models[k]))n.models[k]=v.models[k];
 return n;
}
const MODEL_CHOICES={sugar:['split','joined'],polymer:['stivelse','cellulose','glykogen'],fat:['metta','cis'],amino:['glysin','alanin','serin'],protein:['folded','heat','digest'],atp:['use','build']};

function isMulti(q){return q.type==='fill'||q.type==='match';}
function normalizeWord(s){return String(s).normalize('NFKC').toLocaleLowerCase('nn-NO').trim().replace(/\s+/g,' ').replace(/[.!?]$/,'');}
function entryCorrect(q,i,value){return q.type==='match'?value===q.items[i].answer:(q.items[i].accept||[q.items[i].answer]).some(a=>normalizeWord(a)===normalizeWord(value));}
function entryLabel(q,i,value){return q.type==='match'?(q.choices.find(c=>c.id===value)?.label||'Ubesvart.'):value.trim()||'Ubesvart.';}
function correctLabel(q,i){return q.type==='match'?q.choices.find(c=>c.id===q.items[i].answer).label:q.items[i].answer;}
function answer(q){return state.answers[q.id]||(state.answers[q.id]=isMulti(q)?{entries:q.items.map(()=>''),checkedEntries:null,tries:0,revealed:false,correct:false,independent:false}:q.type==='open'?{text:'',show:false,checks:q.checks.map(()=>false),rating:''}:{choice:null,checked:null,tries:0,revealed:false,correct:false,independent:false});}
function complete(q){const a=state.answers[q.id];return !!a&&(q.type==='open'?!!a.text.trim()&&!!a.rating:a.correct||a.revealed);}
function lessonComplete(i){return !!state.read[i]&&QUESTIONS.filter(q=>q.lesson===i).every(complete);}
function progress(){return Math.round((QUESTIONS.filter(complete).length+Object.values(state.read).filter(Boolean).length)/(QUESTIONS.length+LESSONS.length)*100);}

 const good=[],work=[];
 const topics=[...new Set(QUESTIONS.filter(q=>q.lesson<LESSONS.length-1).map(q=>q.topic))];
 for(const topic of topics){const qs=closed.filter(q=>q.topic===topic),done=qs.filter(q=>state.answers[q.id]?.correct),solo=done.filter(q=>state.answers[q.id]?.independent);if(solo.length)good.push(`${topic}: ${solo.length} av ${qs.length} kontrolloppgåver er rette på første forsøk utan vist løysing.`);const need=qs.filter(q=>!state.answers[q.id]?.correct||!state.answers[q.id]?.independent);if(need.length)work.push(`${topic}: ${need.length} kontrolloppgåve${need.length===1?'':'r'} er løyst med støtte eller står att. Gå tilbake og forklar samanhengen utan svaralternativ.`);}
 for(const q of open){const a=state.answers[q.id];if(a?.text.trim()&&a.rating==='secure')good.push(`Eigenvurdering: Du vurderer at du kan forklare «${q.title}» sjølv.`);else if(a?.text.trim()&&a.rating==='practice')work.push(q.advice);else if(a?.text.trim())work.push(`Samanlikn svaret ditt på «${q.title}» med modellsvaret og fullfør eigenvurderinga.`);else work.push(`Skriv ei eiga forklaring: «${q.title}»`);}
 const end=closed.filter(q=>q.topic==='Sluttkontroll');const endGood=end.filter(q=>state.answers[q.id]?.correct).length;for(const q of end)if(!state.answers[q.id]?.correct||!state.answers[q.id]?.independent)work.push('Sluttkontroll: '+q.hints[1]);if(endGood)good.push(`Sluttkontroll: ${endGood} av ${end.length} svar er rette etter siste kontroll.`);
 return {independent,supported,remaining,good,work,open,closed};
}
function renderSummary(){
 const f=feedbackData();return `<section class="card" id="summary"><span class="section-label">Di faglege oversikt</span><h2>Dette tek du med deg vidare</h2><p>Tilbakemeldinga byggjer på svara dine og hjelpa du har brukt. Opne svar er eigenvurderte, ikkje vurderte av KI eller lærar. Oversikta er øving, ikkje ein karakter.</p>${APP_MODE==='source'?`<div class="summary-metric"><strong>${QUESTIONS.filter(complete).length} / ${QUESTIONS.length}</strong> kjeldeanalysar med eigenvurdering</div>`:`<div class="grid3"><div class="summary-metric"><strong>${f.independent.length}</strong>rette på første forsøk</div><div class="summary-metric"><strong>${f.supported.length}</strong>gjennomførte med støtte</div><div class="summary-metric"><strong>${f.remaining.length}</strong>kontrolloppgåver står att</div></div>`}<h3 style="margin-top:25px">Dette har du fått til</h3>${f.good.length?`<ul class="summary-list">${f.good.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul>`:'<p>Fullfør nokre oppgåver for å få ei tilbakemelding her.</p>'}<h3>Dette bør du arbeide meir med</h3>${f.work.length?`<ul class="summary-list">${f.work.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul>`:'<p>Alle delane er gjennomførte. Prøv å forklare samanhengane på nytt utan hjelp.</p>'}<div class="callout">Eit rett svar viser kva du har svart på denne oppgåva. Det dokumenterer ikkje åleine full forståing av heile læringsmålet.</div>${previousAnswersHTML()}<label for="studentName">Namn på PDF-en (valfritt)</label><p><input type="text" id="studentName" maxlength="100" value="${escapeHTML(state.name)}" placeholder="Du kan la feltet stå tomt"></p><div class="actions"><button class="primary" id="printReport">Lagre som PDF</button><button id="backupSummary">Last ned reservefil</button><button class="ghost small" id="reset">Nullstill arbeidet</button></div><p class="diagram-note">«Lagre som PDF» opnar utskrift. Vel PDF som skrivar/mål. Alle svar, eigenvurderingar, figurar og tilbakemeldingar blir med, også om du ikkje er ferdig. Reservefila kan opnast att i læringsstien; PDF-en kan ikkje importerast.</p></section>`;
}
function previousAnswersHTML(){const old=Object.entries(state.previousAnswers||{});return old.length?`<details><summary>Svar frå førre versjon (${old.length})</summary><p>Desse oppgåvene er erstatta. Svara er tekne vare på, men inngår ikkje i framdrift eller tilbakemelding for dei nye oppgåvene.</p>${old.map(([id,a])=>`<h4>${RETIRED[id]}</h4><p><span data-user-content>${escapeHTML(a.text)}</span></p>`).join('')}</details>`:'';}
function bindSummary(){if(!$('#summary'))return;$('#printReport').onclick=printReport;$('#backupSummary').onclick=downloadBackup;$('#studentName').oninput=e=>{state.name=e.target.value;persist();};$('#reset').onclick=()=>{if(askConfirmation('Vil du slette alle svar og all framdrift i denne nettlesaren? Last ned PDF eller reservefil først.')){const lang=state.lang;state=blank();state.lang=lang;setContentLanguage(lang);persist();render();toast('Arbeidet er nullstilt i denne nettlesaren.');}};}
function refreshSummary(){if($('#summary')){$('#summary').outerHTML=renderSummary();bindSummary();}}
function downloadBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=APP_MODE==='source'?'kjeldeblikk-framdrift.json':'molekyl-til-maltid-framdrift.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('Reservefila er klargjord for nedlasting.');}
async function importBackup(e){const file=e.target.files[0];if(!file)return;try{if(file.size>1500000)throw Error('Fila er for stor. Vel ei reservefil frå denne læringsstien.');const next=validateState(JSON.parse(await file.text()));const hasWork=Object.values(state.answers).some(a=>a.text?.trim()||a.choice!==undefined&&a.choice!==null||a.revealed)||Object.values(state.read).some(Boolean);if(hasWork&&!askConfirmation('Innhaldet i reservefila vil erstatte svara i denne nettlesaren. Vil du halde fram?'))return;state=next;setContentLanguage(state.lang);persist();render();toast('Framdrifta er henta inn.');}catch(err){toast('Kunne ikkje lese fila. '+(err instanceof SyntaxError?'Fila er ikkje gyldig JSON.':err.message));}finally{if($('#importFile'))$('#importFile').value='';}}
function readingForPrint(r){return `<article class="source-article print-reading"><h3>Tekst ${r.id.toUpperCase()}: ${r.title}</h3><p><strong>${r.sender}</strong><br>${r.meta}</p>${r.paragraphs.map(p=>`<p>${p}</p>`).join('')}<h4>Oppgitte referansar i øvingsteksten – ikkje nødvendigvis ekte</h4><ul>${r.references.map(x=>`<li>${x.label}${x.url?'<br>'+x.url:''}</li>`).join('')}</ul></article>`;}
function printReport(){
 const f=feedbackData(),date=new Date().toLocaleString(CURRENT_LANGUAGE==='nb'?'nb-NO':'nn-NO',{dateStyle:'long',timeStyle:'short'});
 let out=`<div class="print-lead"><p>NATURFAG SF · ENERGIGIVANDE NÆRINGSSTOFF</p><h1>${APP_MODE==='source'?'Kjeldeblikk – næringsstoff':'Frå molekyl til måltid'}</h1><p>${state.name?'Namn: <span data-user-content>'+escapeHTML(state.name)+'</span><br>':''}Lagra: ${date}<br>Framdrift: ${progress()} % · ${QUESTIONS.filter(complete).length} av ${QUESTIONS.length} oppgåver gjennomførte</p></div><h2>Du skal kunne</h2><ul>${GOALS.map(g=>`<li>${g}</li>`).join('')}</ul><h2>Di tilbakemelding</h2><p>${APP_MODE==='source'?`Kjeldeanalysar: ${QUESTIONS.filter(complete).length} av ${QUESTIONS.length} fullførte med eigenvurdering.`:`Kontrolloppgåver: ${f.independent.length} rette på første forsøk; ${f.supported.length} gjennomførte med støtte; ${f.remaining.length} står att.`} Opne svar er eigenvurderte. Dette er ikkje ei lærar- eller KI-vurdering og gir ingen karakter.</p><h3>Dette har du fått til</h3>${f.good.length?'<ul>'+f.good.map(t=>'<li>'+escapeHTML(t)+'</li>').join('')+'</ul>':'<p>Enno ikkje grunnlag for ei tilbakemelding.</p>'}<h3>Dette bør du arbeide meir med</h3>${f.work.length?'<ul>'+f.work.map(t=>'<li>'+escapeHTML(t)+'</li>').join('')+'</ul>':'<p>Forklar samanhengane på nytt utan hjelp.</p>'}`;
 for(let i=0;i<LESSONS.length;i++){
  const l=LESSONS[i];out+=`<h2>${i+1}. ${l.title}</h2><p class="print-status">Fagstoff: ${state.read[i]?'merkt som gjennomgått':'ikkje merkt som gjennomgått'}.</p>`;
  if(i===4)out+=l.blocks.filter(b=>typeof b==='string'&&(/assets\/(vatn-og-stoff|tre-prosessar|bygg-og-bryt|energi-veg|atp-modell|atp-syklus)\.svg/.test(b)||b.includes('class="energy-heading"'))).join('');
  // Include the full structure figures associated with each content section, once per lesson.
  const files=new Map();for(const b of l.blocks)if(typeof b==='string')for(const m of b.matchAll(/<img src="([^"]+)" alt="([^"]*)"/g)){if(!m[1].includes('assets/mat-')&&!m[1].includes('-foto.jpg')&&i!==4)files.set(m[1],m[2]);}
  if(i===3)for(const n of ['glysin','alanin','serin'])files.set('assets/'+n+'.svg',n+' – døme, ikkje krav om utanåtlæring.');
  if(files.size)out+=`<div>${[...files].map(([src,alt])=>`<figure><img src="${src}" alt="${escapeHTML(alt)}"><figcaption>${escapeHTML(alt)}</figcaption></figure>`).join('')}</div>`;
  const orderedQs=l.blocks.filter(b=>typeof b==='object'&&b.q).map(b=>BYID[b.q]);
  for(const q of orderedQs){
   const a=answer(q);if(q.articleId){const r=READINGS.find(r=>r.id===q.articleId);out+=`<aside class="print-exercise-warning"><strong>Konstruert kjeldeøving – teksten kan innehalde feil og oppdikta referansar. Han er ikkje ei fagkjelde.</strong></aside>`+readingForPrint(r);}
   out+=`<section class="print-item"><h3>${q.title}</h3>${q.instructions?`<p>${q.instructions}</p>`:''}`;
   if(isMulti(q)){
    out+=`<ol>${q.items.map((it,j)=>`<li><strong>${q.type==='match'?it.term:it.before+' … '+it.after}</strong><p>Ditt svar: <span data-user-content>${escapeHTML(entryLabel(q,j,a.entries[j]))}</span></p>${a.correct||a.revealed?`<p>Rett svar: ${escapeHTML(correctLabel(q,j))}</p>`:a.checkedEntries?`<p>${entryCorrect(q,j,a.checkedEntries[j])?'Rett ved siste kontroll.':'Hint: '+it.hint}</p>`:''}</li>`).join('')}</ol><p class="print-status">${a.correct?(a.independent?'Rett på første forsøk utan vist løysing.':'Rett etter støtte eller fleire forsøk.'):a.revealed?'Løysing vist – gjennomført med støtte.':'Ikkje ferdig kontrollert.'}</p>${a.correct||a.revealed?`<p>${q.explain}</p>`:''}`;
   }else if(q.type==='open'){
    out+=`<p><strong>Ditt svar:</strong> ${a.text.trim()?'<span data-user-content>'+escapeHTML(a.text)+'</span>':'Ubesvart.'}</p><p class="print-self"><strong>Eigenvurdering:</strong> ${a.rating==='secure'?'Eg kan forklare dette sjølv.':a.rating==='practice'?'Eg treng meir øving.':'Ikkje fullført.'}</p>`;
    if(a.show)out+=`<p><strong>Sjekkpunkt:</strong><br>${q.checks.map((c,j)=>`${a.checks[j]?'✓':'○'} ${c}`).join('<br>')}</p><div><strong>${q.articleId?'Fasit og faktakontroll':'Modellsvar'}:</strong> ${q.model}</div>`;
   }else{
    out+=`<p><strong>Ditt val:</strong> ${a.choice===null?'Ubesvart.':escapeHTML(q.options[a.choice])}</p><p class="print-status">${a.correct?(a.independent?'Rett på første forsøk utan vist løysing.':'Rett etter støtte eller fleire forsøk.'):a.revealed?'Løysing vist – gjennomført med støtte.':a.checked!==null?'Ikkje rett enno.':'Ikkje kontrollert.'}</p>`;
    if(a.correct||a.revealed)out+=`<p><strong>Fagleg forklaring:</strong> ${q.explain}</p>`;
    else if(a.checked!==null)out+=`<p><strong>Hint:</strong> ${q.hints[Math.min(a.tries-1,q.hints.length-1)]}</p>`;
   }out+='</section>';
  }
 }
 const summaryBlock=APP_MODE==='source'?'':LESSONS[LESSONS.length-1].blocks.find(b=>typeof b==='string'&&(b.includes('Kort fagleg samandrag')||b.includes('Kort faglig samandrag')||b.includes('Kort faglig sammendrag')))||'';
 out+=summaryBlock+previousAnswersHTML()+`<h2>Kjelder</h2><p>Fagtekst og modellar er laga for læringsstien. Kjelder kontrollerte 1. november 2026. Modellane er forenklingar; bindingsoversiktene viser ikkje nøyaktig romleg struktur. Aminosyrestrukturane er døme, ikkje krav om utanåtlæring. Energidelen byggjer også på læraren sin presentasjon «Næringsstoff», lysbilete 3–6.</p><ul class="print-source">${SOURCES.map(([n,u])=>`<li>${n}<br>${u}</li>`).join('')}</ul>`;
 $('#printout').innerHTML=out;resolveEmbeddedAssets($('#printout'));applyLanguageDOM($('#printout'));
 // Wait for SVG figures to load before handing the complete report to the print dialog.
 const images=[...$('#printout').querySelectorAll('img')];Promise.all(images.map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.onload=img.onerror=resolve;}))).then(()=>window.print());
}
render(false);
</script></body></html>
