<!DOCTYPE html>
<html lang="nn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reaksjonslikning-meisteren</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React og ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for å kjøre JSX direkte i nettlesaren -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Database med alle 44 reaksjonslikningar inkludert vanskegrad og tilstandssymbol
    const equationDB = [
      { id: 1, r: ["H2", "O2"], rs: ["g", "g"], rc: [2, 1], p: ["H2O"], ps: ["l"], pc: [2], difficulty: "enkel" },
      { id: 2, r: ["N2", "H2"], rs: ["g", "g"], rc: [1, 3], p: ["NH3"], ps: ["g"], pc: [2], difficulty: "medium" },
      { id: 3, r: ["CH4", "O2"], rs: ["g", "g"], rc: [1, 2], p: ["CO2", "H2O"], ps: ["g", "g"], pc: [1, 2], difficulty: "medium" },
      { id: 4, r: ["Na", "Cl2"], rs: ["s", "g"], rc: [2, 1], p: ["NaCl"], ps: ["s"], pc: [2], difficulty: "medium" },
      { id: 5, r: ["Mg", "O2"], rs: ["s", "g"], rc: [2, 1], p: ["MgO"], ps: ["s"], pc: [2], difficulty: "medium" },
      { id: 6, r: ["C3H8", "O2"], rs: ["g", "g"], rc: [1, 5], p: ["CO2", "H2O"], ps: ["g", "g"], pc: [3, 4], difficulty: "utfordrande" },
      { id: 7, r: ["Fe", "O2"], rs: ["s", "g"], rc: [4, 3], p: ["Fe2O3"], ps: ["s"], pc: [2], difficulty: "medium" },
      { id: 8, r: ["Al", "O2"], rs: ["s", "g"], rc: [4, 3], p: ["Al2O3"], ps: ["s"], pc: [2], difficulty: "medium" },
      { id: 9, r: ["H2O2"], rs: ["aq"], rc: [2], p: ["H2O", "O2"], ps: ["l", "g"], pc: [2, 1], difficulty: "enkel" },
      { id: 10, r: ["K", "H2O"], rs: ["s", "l"], rc: [2, 2], p: ["KOH", "H2"], ps: ["aq", "g"], pc: [2, 1], difficulty: "enkel" },
      { id: 11, r: ["S8", "O2"], rs: ["s", "g"], rc: [1, 8], p: ["SO2"], ps: ["g"], pc: [8], difficulty: "medium" },
      { id: 12, r: ["N2", "O2"], rs: ["g", "g"], rc: [1, 2], p: ["NO2"], ps: ["g"], pc: [2], difficulty: "utfordrande" },
      { id: 13, r: ["C2H6", "O2"], rs: ["g", "g"], rc: [2, 7], p: ["CO2", "H2O"], ps: ["g", "g"], pc: [4, 6], difficulty: "utfordrande" },
      { id: 14, r: ["SO2", "O2"], rs: ["g", "g"], rc: [2, 1], p: ["SO3"], ps: ["g"], pc: [2], difficulty: "enkel" },
      { id: 15, r: ["KClO3"], rs: ["s"], rc: [2], p: ["KCl", "O2"], ps: ["s", "g"], pc: [2, 3], difficulty: "medium" },
      { id: 16, r: ["Fe", "Cl2"], rs: ["s", "g"], rc: [2, 3], p: ["FeCl3"], ps: ["s"], pc: [2], difficulty: "medium" },
      { id: 17, r: ["Zn", "HCl"], rs: ["s", "aq"], rc: [1, 2], p: ["ZnCl2", "H2"], ps: ["aq", "g"], pc: [1, 1], difficulty: "enkel" },
      { id: 18, r: ["C6H12O6", "O2"], rs: ["aq", "g"], rc: [1, 6], p: ["CO2", "H2O"], ps: ["g", "l"], pc: [6, 6], difficulty: "utfordrande" },
      { id: 19, r: ["NH3", "O2"], rs: ["g", "g"], rc: [4, 5], p: ["NO", "H2O"], ps: ["g", "g"], pc: [4, 6], difficulty: "utfordrande" },
      { id: 20, r: ["P4", "O2"], rs: ["s", "g"], rc: [1, 5], p: ["P4O10"], ps: ["s"], pc: [1], difficulty: "medium" },
      { id: 21, r: ["C2H5OH", "O2"], rs: ["l", "g"], rc: [1, 3], p: ["CO2", "H2O"], ps: ["g", "g"], pc: [2, 3], difficulty: "medium" },
      { id: 22, r: ["Ag2O"], rs: ["s"], rc: [2], p: ["Ag", "O2"], ps: ["s", "g"], pc: [4, 1], difficulty: "medium" },
      { id: 23, r: ["C4H10", "O2"], rs: ["g", "g"], rc: [2, 13], p: ["CO2", "H2O"], ps: ["g", "g"], pc: [8, 10], difficulty: "utfordrande" },
      { id: 24, r: ["C6H12O6"], rs: ["aq"], rc: [1], p: ["C2H5OH", "CO2"], ps: ["aq", "g"], pc: [2, 2], difficulty: "medium" },
      { id: 25, r: ["CaCO3"], rs: ["s"], rc: [1], p: ["CaO", "CO2"], ps: ["s", "g"], pc: [1, 1], difficulty: "enkel" },
      { id: 26, r: ["CaO", "H2O"], rs: ["s", "l"], rc: [1, 1], p: ["Ca(OH)2"], ps: ["s"], pc: [1], difficulty: "enkel" },
      { id: 27, r: ["HCl", "NaOH"], rs: ["aq", "aq"], rc: [1, 1], p: ["NaCl", "H2O"], ps: ["aq", "l"], pc: [1, 1], difficulty: "enkel" },
      { id: 28, r: ["H2SO4", "NaOH"], rs: ["aq", "aq"], rc: [1, 2], p: ["Na2SO4", "H2O"], ps: ["aq", "l"], pc: [1, 2], difficulty: "medium" },
      { id: 29, r: ["Mg", "HCl"], rs: ["s", "aq"], rc: [1, 2], p: ["MgCl2", "H2"], ps: ["aq", "g"], pc: [1, 1], difficulty: "enkel" },
      { id: 30, r: ["Al", "HCl"], rs: ["s", "aq"], rc: [2, 6], p: ["AlCl3", "H2"], ps: ["aq", "g"], pc: [2, 3], difficulty: "utfordrande" },
      { id: 31, r: ["Cu", "AgNO3"], rs: ["s", "aq"], rc: [1, 2], p: ["Cu(NO3)2", "Ag"], ps: ["aq", "s"], pc: [1, 2], difficulty: "enkel" },
      { id: 32, r: ["Fe", "CuSO4"], rs: ["s", "aq"], rc: [1, 1], p: ["FeSO4", "Cu"], ps: ["aq", "s"], pc: [1, 1], difficulty: "enkel" },
      { id: 33, r: ["Li", "H2O"], rs: ["s", "l"], rc: [2, 2], p: ["LiOH", "H2"], ps: ["aq", "g"], pc: [2, 1], difficulty: "enkel" },
      { id: 34, r: ["CH3OH", "O2"], rs: ["l", "g"], rc: [2, 3], p: ["CO2", "H2O"], ps: ["g", "g"], pc: [2, 4], difficulty: "utfordrande" },
      { id: 35, r: ["Pb(NO3)2", "KI"], rs: ["aq", "aq"], rc: [1, 2], p: ["PbI2", "KNO3"], ps: ["s", "aq"], pc: [1, 2], difficulty: "medium" },
      { id: 36, r: ["CaCO3", "HCl"], rs: ["s", "aq"], rc: [1, 2], p: ["CaCl2", "H2O", "CO2"], ps: ["aq", "l", "g"], pc: [1, 1, 1], difficulty: "enkel" },
      { id: 37, r: ["NaHCO3"], rs: ["s"], rc: [2], p: ["Na2CO3", "H2O", "CO2"], ps: ["s", "g", "g"], pc: [1, 1, 1], difficulty: "enkel" },
      { id: 38, r: ["SO3", "H2O"], rs: ["g", "l"], rc: [1, 1], p: ["H2SO4"], ps: ["aq"], pc: [1], difficulty: "enkel" },
      { id: 39, r: ["NO", "O2"], rs: ["g", "g"], rc: [2, 1], p: ["NO2"], ps: ["g"], pc: [2], difficulty: "enkel" },
      { id: 40, r: ["H2S", "O2"], rs: ["g", "g"], rc: [2, 3], p: ["SO2", "H2O"], ps: ["g", "g"], pc: [2, 2], difficulty: "medium" },
      { id: 41, r: ["C2H2", "O2"], rs: ["g", "g"], rc: [2, 5], p: ["CO2", "H2O"], ps: ["g", "g"], pc: [4, 2], difficulty: "utfordrande" },
      { id: 42, r: ["CuO", "H2"], rs: ["s", "g"], rc: [1, 1], p: ["Cu", "H2O"], ps: ["s", "g"], pc: [1, 1], difficulty: "enkel" },
      { id: 43, r: ["Fe2O3", "CO"], rs: ["s", "g"], rc: [1, 3], p: ["Fe", "CO2"], ps: ["s", "g"], pc: [2, 3], difficulty: "utfordrande" },
      { id: 44, r: ["Fe2O3", "Al"], rs: ["s", "s"], rc: [1, 2], p: ["Al2O3", "Fe"], ps: ["s", "s"], pc: [1, 2], difficulty: "medium" }
    ];

    const formatFormula = (formula, state) => {
      const parts = formula.split(/(\d+)/);
      return (
        <span className="inline-flex items-baseline">
          <span>
            {parts.map((part, i) =>
              /^\d+$/.test(part) ? <sub key={i} className="text-[0.75em]">{part}</sub> : part
            )}
          </span>
          {state && (
            <span className="text-[0.65em] font-normal text-emerald-300/80 italic ml-0.5">
              ({state})
            </span>
          )}
        </span>
      );
    };

    function App() {
      const [gameState, setGameState] = useState('start');
      const [currentQuestion, setCurrentQuestion] = useState(null);
      const [questionNum, setQuestionNum] = useState(1);
      const [playedIds, setPlayedIds] = useState([]);
      const [score, setScore] = useState(0);
      const [attempts, setAttempts] = useState(0);
      const [inputs, setInputs] = useState([]);
      const [feedback, setFeedback] = useState(null);
      const [warningMsg, setWarningMsg] = useState('');

      // State for aktiverte vanskegradar. "Enkel" er valt som standard.
      const [difficulties, setDifficulties] = useState({
        enkel: true,
        medium: false,
        utfordrande: false
      });

      const toggleDifficulty = (diffKey) => {
        const currentlyActiveCount = Object.values(difficulties).filter(Boolean).length;
        if (difficulties[diffKey] && currentlyActiveCount <= 1) {
          setWarningMsg('Minst ein vanskegrad må vere vald!');
          return;
        }

        setWarningMsg('');
        setDifficulties(prev => ({
          ...prev,
          [diffKey]: !prev[diffKey]
        }));
      };

      const getFilteredEquations = (diffState = difficulties) => {
        return equationDB.filter(eq => diffState[eq.difficulty]);
      };

      const initInputs = (eq) => {
        if (!eq) return;
        const totalInputs = eq.r.length + eq.p.length;
        // Standard startverdi "1"
        setInputs(Array(totalInputs).fill('1'));
      };

      const getNextQuestionObject = (currentPlayedList = playedIds) => {
        const filtered = getFilteredEquations();
        if (filtered.length === 0) return null;

        // Prøv å finne ein ubytta oppgåve som passar noverande vanskegradar
        let unplayed = filtered.filter(q => !currentPlayedList.includes(q.id));
        if (unplayed.length === 0) {
          // Dersom alle i kategorien er spelte, tilbakestill eller vel på nytt frå filtered
          unplayed = filtered;
        }

        return unplayed[Math.floor(Math.random() * unplayed.length)];
      };

      const startGame = () => {
        const filtered = getFilteredEquations();
        if (filtered.length === 0) {
          setWarningMsg('Vel minst ein vanskegrad for å starte.');
          return;
        }
        
        const firstQ = getNextQuestionObject([]);
        setCurrentQuestion(firstQ);
        setPlayedIds([firstQ.id]);
        setQuestionNum(1);
        setScore(0);
        setAttempts(0);
        setGameState('playing');
        initInputs(firstQ);
        setFeedback(null);
        setWarningMsg('');
      };

      const handleInputChange = (index, value) => {
        setWarningMsg('');
        if (value === '' || (/^\d+$/.test(value) && parseInt(value) > 0)) {
          const newInputs = [...inputs];
          newInputs[index] = value;
          setInputs(newInputs);
        }
      };

      const checkAnswer = () => {
        if (!currentQuestion) return;
        const correctAnswers = [...currentQuestion.rc, ...currentQuestion.pc];
        
        if (inputs.some(val => val === '')) {
          setWarningMsg('Du må fylle inn tal i alle boksane!');
          return;
        }

        const isCorrect = correctAnswers.every((ans, idx) => ans === parseInt(inputs[idx]));

        if (isCorrect) {
          setFeedback('correct');
          setScore(prev => prev + 100);
          setWarningMsg('');
        } else {
          const newAttempts = attempts + 1;
          setAttempts(newAttempts);
          setScore(prev => prev - 20);
          
          if (newAttempts > 0 && newAttempts % 3 === 0) {
            const wrongIdx = inputs.findIndex((val, idx) => parseInt(val) !== correctAnswers[idx]);
            if (wrongIdx !== -1) {
              const newInputs = [...inputs];
              newInputs[wrongIdx] = correctAnswers[wrongIdx].toString();
              setInputs(newInputs);
              setFeedback('hint');
            } else {
              setFeedback('incorrect');
            }
          } else {
            setFeedback('incorrect');
          }
        }
      };

      const nextQuestion = () => {
        if (questionNum >= 10) {
          setGameState('gameover');
        } else {
          // Hentar neste spørsmål dynamisk basert på NYE val i vanskegradar
          const nextQ = getNextQuestionObject(playedIds);
          if (!nextQ) {
            setWarningMsg('Ingen oppgåver tilgjengelege for dei valde vanskegradane!');
            return;
          }

          setCurrentQuestion(nextQ);
          setPlayedIds(prev => [...prev, nextQ.id]);
          setQuestionNum(prev => prev + 1);
          initInputs(nextQ);
          setAttempts(0);
          setFeedback(null);
          setWarningMsg('');
        }
      };

      const DifficultySelector = ({ compact = false }) => (
        <div className={`flex flex-wrap items-center justify-center gap-3 ${compact ? 'py-1' : 'py-3'}`}>
          <span className="text-sm font-semibold text-slate-300 mr-1">Vanskegrad:</span>
          
          <label className={`cursor-pointer inline-flex items-center space-x-2 px-3 py-1.5 rounded-lg border text-sm font-medium transition-all ${
            difficulties.enkel 
              ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300 shadow-[0_0_10px_rgba(16,185,129,0.2)]' 
              : 'bg-slate-800 border-slate-600 text-slate-400 hover:border-slate-500'
          }`}>
            <input
              type="checkbox"
              checked={difficulties.enkel}
              onChange={() => toggleDifficulty('enkel')}
              className="w-4 h-4 accent-emerald-500 rounded cursor-pointer"
            />
            <span>Enkel</span>
          </label>

          <label className={`cursor-pointer inline-flex items-center space-x-2 px-3 py-1.5 rounded-lg border text-sm font-medium transition-all ${
            difficulties.medium 
              ? 'bg-amber-500/20 border-amber-500 text-amber-300 shadow-[0_0_10px_rgba(245,158,11,0.2)]' 
              : 'bg-slate-800 border-slate-600 text-slate-400 hover:border-slate-500'
          }`}>
            <input
              type="checkbox"
              checked={difficulties.medium}
              onChange={() => toggleDifficulty('medium')}
              className="w-4 h-4 accent-amber-500 rounded cursor-pointer"
            />
            <span>Medium</span>
          </label>

          <label className={`cursor-pointer inline-flex items-center space-x-2 px-3 py-1.5 rounded-lg border text-sm font-medium transition-all ${
            difficulties.utfordrande 
              ? 'bg-rose-500/20 border-rose-500 text-rose-300 shadow-[0_0_10px_rgba(244,63,94,0.2)]' 
              : 'bg-slate-800 border-slate-600 text-slate-400 hover:border-slate-500'
          }`}>
            <input
              type="checkbox"
              checked={difficulties.utfordrande}
              onChange={() => toggleDifficulty('utfordrande')}
              className="w-4 h-4 accent-rose-500 rounded cursor-pointer"
            />
            <span>Utfordrande</span>
          </label>
        </div>
      );

      if (gameState === 'start') {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 text-slate-100 font-sans">
            <div className="max-w-2xl bg-slate-800 rounded-2xl shadow-2xl p-6 md:p-10 text-center border border-slate-700">
              <div className="flex justify-center mb-4">
                <div className="bg-emerald-500/20 p-4 rounded-full">
                  <svg className="w-14 h-14 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                  </svg>
                </div>
              </div>
              <h1 className="text-3xl md:text-5xl font-extrabold mb-4 tracking-tight text-white">
                Balanser <span className="text-emerald-400">Reaksjonslikningane!</span>
              </h1>
              
              <div className="text-slate-300 mb-6 text-left bg-slate-800/60 p-5 rounded-xl border border-slate-700 space-y-3">
                <p className="font-semibold text-slate-200">Slik gjer du det:</p>
                <ul className="list-disc pl-5 space-y-1.5 text-sm md:text-base">
                  <li>Fyll inn dei rette tala (koeffisientane) i boksane framfor molekyla. Dei startar automatisk på <strong>1</strong>.</li>
                  <li>Tilstandssymbola er oppgjevne i parentes: <em>(s)</em> fast, <em>(l)</em> væske, <em>(g)</em> gass, og <em>(aq)</em> i vatn.</li>
                  <li>Målet er at det skal vere <strong>like mange atom av kvar type</strong> på begge sider av pila.</li>
                  <li>Du får 100 poeng for rett svar, og -20 poeng ved feil.</li>
                </ul>
              </div>

              {/* Velje vanskegradar */}
              <div className="bg-slate-900/60 p-4 rounded-xl border border-slate-700/80 mb-6">
                <DifficultySelector />
                {warningMsg && (
                  <p className="text-amber-400 text-xs mt-2 font-medium">{warningMsg}</p>
                )}
              </div>
              
              <button 
                onClick={startGame}
                className="w-full md:w-auto px-8 py-4 bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-bold rounded-xl text-xl transition-all transform hover:scale-105 shadow-[0_0_20px_rgba(16,185,129,0.4)]"
              >
                Start Spelet
              </button>
            </div>
          </div>
        );
      }

      if (gameState === 'gameover') {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 text-slate-100 font-sans">
            <div className="max-w-xl w-full bg-slate-800 rounded-2xl shadow-2xl p-8 md:p-12 text-center border border-slate-700 relative overflow-hidden">
              <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-emerald-400 to-blue-500"></div>
              <h2 className="text-4xl font-bold mb-8 text-white">Spelet er ferdig!</h2>
              
              <div className="flex justify-center mb-8">
                <div className="bg-slate-700/50 p-8 rounded-xl border border-slate-600 w-full max-w-sm">
                  <p className="text-sm text-slate-400 uppercase tracking-wider mb-2">Din poengsum</p>
                  <p className="text-6xl font-extrabold text-emerald-400">{score}</p>
                </div>
              </div>

              <p className="text-lg text-slate-300 mb-8">
                Flott innsats! Du har visst god forståing for korleis atom bevarast i kjemiske reaksjonar.
              </p>

              <button 
                onClick={startGame}
                className="w-full px-8 py-4 bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-bold rounded-xl text-xl transition-all shadow-lg hover:shadow-emerald-500/20"
              >
                Spel på nytt
              </button>
            </div>
          </div>
        );
      }

      if (!currentQuestion) return null;

      const totalReactants = currentQuestion.r.length;

      // Badge-farge for vanskegrad på gjeldande oppgåve
      const difficultyBadges = {
        enkel: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40',
        medium: 'bg-amber-500/20 text-amber-300 border-amber-500/40',
        utfordrande: 'bg-rose-500/20 text-rose-300 border-rose-500/40'
      };

      return (
        <div className="min-h-screen bg-slate-900 flex flex-col items-center justify-center p-4 md:p-8 text-slate-100 font-sans">
          
          {/* Top Info Bar */}
          <div className="w-full max-w-4xl flex flex-wrap justify-between items-center mb-6 gap-4 bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 bg-slate-700 rounded-lg flex items-center justify-center font-bold text-slate-300">
                {questionNum}/10
              </div>
              <div>
                <span className="text-slate-400 text-xs uppercase font-bold tracking-wider block">Likning</span>
                <span className={`text-xs px-2 py-0.5 rounded border capitalize font-medium ${difficultyBadges[currentQuestion.difficulty]}`}>
                  {currentQuestion.difficulty}
                </span>
              </div>
            </div>
            
            <div className="flex items-center space-x-6">
              <div className="flex flex-col items-center">
                <span className="text-xs text-slate-400 uppercase font-bold tracking-widest">Poeng</span>
                <span className="text-2xl font-mono text-emerald-400">{score}</span>
              </div>
            </div>
          </div>

          {/* In-game difficulty controller */}
          <div className="w-full max-w-4xl bg-slate-800/80 mb-6 px-4 py-2 rounded-xl border border-slate-700 flex flex-col sm:flex-row items-center justify-between gap-2">
            <span className="text-xs text-slate-400 font-medium">Endre vanskegrada frå neste oppgåve:</span>
            <DifficultySelector compact={true} />
          </div>

          {/* Main Equation Balancing Card */}
          <div className="w-full max-w-4xl bg-slate-800 rounded-2xl shadow-2xl p-6 md:p-12 border border-slate-700">
            <h2 className="text-2xl text-center font-semibold text-slate-300 mb-10">
              Balanser denne likninga:
            </h2>

            <div className="flex flex-col md:flex-row items-center justify-center gap-y-6 md:gap-x-6 text-2xl md:text-3xl font-bold mb-8">
              
              {/* Reactants */}
              <div className="flex flex-wrap items-center justify-center gap-x-2 md:gap-x-3 gap-y-4">
                {currentQuestion.r.map((reactant, i) => (
                  <React.Fragment key={`r-${i}`}>
                    <div className="flex items-center space-x-2">
                      <input 
                        type="number" 
                        min="1"
                        value={inputs[i]}
                        onChange={(e) => handleInputChange(i, e.target.value)}
                        disabled={feedback === 'correct'}
                        className={`w-14 h-16 md:w-18 md:h-18 text-center rounded-xl bg-slate-700 border-2 outline-none transition-all font-mono text-2xl md:text-3xl
                          ${feedback === 'correct' ? 'border-emerald-500 text-emerald-400' : 
                            'border-slate-500 focus:border-blue-500 focus:bg-slate-600 text-white shadow-inner'}
                        `}
                      />
                      <span className="text-emerald-300 tracking-wide">
                        {formatFormula(reactant, currentQuestion.rs[i])}
                      </span>
                    </div>
                    {i < currentQuestion.r.length - 1 && <span className="text-slate-500 mx-1">+</span>}
                  </React.Fragment>
                ))}
              </div>

              <span className="text-slate-400 text-3xl md:text-4xl mx-2">➔</span>

              {/* Products */}
              <div className="flex flex-wrap items-center justify-center gap-x-2 md:gap-x-3 gap-y-4">
                {currentQuestion.p.map((product, i) => {
                  const inputIndex = totalReactants + i;
                  return (
                    <React.Fragment key={`p-${i}`}>
                      <div className="flex items-center space-x-2">
                        <input 
                          type="number" 
                          min="1"
                          value={inputs[inputIndex]}
                          onChange={(e) => handleInputChange(inputIndex, e.target.value)}
                          disabled={feedback === 'correct'}
                          className={`w-14 h-16 md:w-18 md:h-18 text-center rounded-xl bg-slate-700 border-2 outline-none transition-all font-mono text-2xl md:text-3xl
                            ${feedback === 'correct' ? 'border-emerald-500 text-emerald-400' : 
                              'border-slate-500 focus:border-blue-500 focus:bg-slate-600 text-white shadow-inner'}
                          `}
                        />
                        <span className="text-blue-300 tracking-wide">
                          {formatFormula(product, currentQuestion.ps[i])}
                        </span>
                      </div>
                      {i < currentQuestion.p.length - 1 && <span className="text-slate-500 mx-1">+</span>}
                    </React.Fragment>
                  );
                })}
              </div>
            </div>

            {warningMsg && (
              <div className="mb-6 p-3 bg-amber-500/20 border border-amber-500/50 rounded-lg text-amber-300 text-center font-medium text-sm">
                {warningMsg}
              </div>
            )}

            <div className="flex flex-col items-center justify-center min-h-[90px]">
              {feedback === null && (
                <button 
                  onClick={checkAnswer}
                  className="px-8 py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-xl transition-all shadow-lg hover:shadow-blue-500/30 active:scale-95"
                >
                  Sjekk Svar
                </button>
              )}

              {feedback === 'correct' && (
                <div className="text-center animate-bounce-short">
                  <p className="text-2xl font-bold text-emerald-400 mb-4 flex items-center justify-center">
                    <svg className="w-8 h-8 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" /></svg>
                    Heilt rett!
                  </p>
                  <button 
                    onClick={nextQuestion}
                    className="px-8 py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-bold rounded-xl text-lg transition-all shadow-lg active:scale-95"
                  >
                    Neste likning ➔
                  </button>
                </div>
              )}

              {feedback === 'incorrect' && (
                <div className="text-center">
                  <p className="text-xl font-bold text-red-400 mb-4 flex items-center justify-center">
                    <svg className="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M6 18L18 6M6 6l12 12" /></svg>
                    Ikkje heilt rett. Prøv igjen!
                  </p>
                  <button 
                    onClick={() => setFeedback(null)}
                    className="px-8 py-3 bg-slate-600 hover:bg-slate-500 text-white font-bold rounded-xl text-lg transition-all shadow-lg active:scale-95"
                  >
                    Prøv på nytt
                  </button>
                </div>
              )}

              {feedback === 'hint' && (
                <div className="text-center animate-bounce-short">
                  <p className="text-xl font-bold text-yellow-400 mb-4 flex items-center justify-center">
                    <svg className="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    Hint: Eit av tala er no fylt inn for deg!
                  </p>
                  <button 
                    onClick={() => setFeedback(null)}
                    className="px-8 py-3 bg-yellow-600 hover:bg-yellow-500 text-white font-bold rounded-xl text-lg transition-all shadow-lg active:scale-95"
                  >
                    Sjekk vidare
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
