<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="En interaktiv læringssti i mat og helse for 9. trinn: næringsstoffer, hygiene og oppskrifter."><title>Fra kunnskap til kjøkken · Mat og helse 9</title><style>:root{--ink:#173e35;--muted:#61706a;--green:#205747;--lime:#d9eab0;--paper:#f6f7f1;--line:#dde4d8;--ochre:#a9661f}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:16px;line-height:1.7}h1,h2,h3{line-height:1.22;letter-spacing:-.035em}h1{font-size:clamp(32px,4.4vw,52px);margin:14px 0 20px;max-width:800px}h2{font-size:25px;margin:0 0 17px}h3{font-size:18px;margin:0 0 12px}p{margin:10px 0 18px}a{color:var(--green);text-underline-offset:3px}button,input,textarea,select{font:inherit;color:inherit}button,input,textarea,select,a,summary{outline-offset:4px}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #a9661f}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:10px;padding:10px 16px;font-weight:600;min-height:44px}button:hover{background:#edf2e8}button:disabled{opacity:.5;cursor:default}button.primary{background:var(--green);color:white;border-color:var(--green)}button.primary:hover{background:#143d31}button.small{font-size:12px;padding:7px 11px;min-height:38px}.shell{display:grid;grid-template-columns:265px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:white;border-right:1px solid var(--line);padding:27px 18px;display:flex;flex-direction:column}.brand{display:flex;gap:12px;align-items:center;font-weight:800;font-size:18px;line-height:1.3}.brand-icon{width:40px;height:40px;border-radius:50%;background:var(--green);color:white;display:grid;place-items:center;font-size:22px}.eyebrow,.section-label,.nav-label{font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;color:var(--green)}.nav-label{margin:23px 10px 7px;color:var(--muted)}.nav{display:grid;gap:4px}.nav button{text-align:left;border:0;padding:10px;background:transparent;font-size:13px;display:flex;gap:9px;align-items:center}.nav button.active{background:#eaf1df}.navnum{width:25px;height:25px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-size:11px}.active .navnum{background:var(--green);color:white}.navnum.done{background:var(--lime)}.sidebar-bottom{margin-top:auto;padding:20px 9px 0}.track{height:6px;border-radius:4px;background:#e8ede3;overflow:hidden}.track i{display:block;height:100%;background:var(--green);transition:width .2s}.caption{display:flex;justify-content:space-between;font-size:12px;margin:9px 0}.save-label,.source-note{font-size:12px;color:var(--muted);line-height:1.6}.topbar{padding:16px 38px;display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.content{max-width:1120px;margin:auto;padding:38px 42px 65px;min-width:0}.intro{font-size:18px;color:#566c60;max-width:740px}.lesson-head{margin-bottom:28px}.meta{display:flex;gap:12px;color:var(--muted);font-size:12px;flex-wrap:wrap}.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:24px;align-items:center;background:#e8efdd;border:1px solid #d9e2ca;padding:30px;border-radius:20px;margin:26px 0}.hero h2{font-size:33px;margin-top:13px}.hero svg{width:100%;max-height:250px}.pill{display:inline-block;background:#fff8;border:1px solid #c9d5be;border-radius:20px;font-size:11px;padding:4px 10px;margin:3px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:27px;margin:22px 0;overflow-wrap:anywhere}.card.soft{background:#edf2e6}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid3{display:grid;grid-tem -top:18px}.selfcheck label{display:flex;gap:10px;align-items:flex-start;font-size:14px}.selfcheck input{margin-top:6px;accent-color:var(--green)}.model-answer{border-left:3px solid #88ab65;padding-left:16px;margin:18px 0}.model-answer h4{margin-bottom:8px}.model-answer p{font-size:15px}.lesson-read{display:flex;gap:10px;align-items:flex-start;background:#e9f0df;border-radius:12px;padding:17px 20px;font-size:14px}.lesson-read input{margin-top:6px;accent-color:var(--green)}.footer-nav{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:24px;margin-top:28px;gap:12px}.footer-nav button{max-width:48%;text-align:left}.overflow{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#eef3e7}th:first-child{min-width:115px}ul,ol{padding-left:24px}li{margin:7px 0}details{border-top:1px solid var(--line);padding:15px 0}summary{cursor:pointer;font-weight:650}.source-list{font-size:13px}.flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:20px 0}.flow span{padding:12px;background:#edf3e3;border-radius:10px;font-size:14px}.grain-wrap{display:grid;grid-template-columns:1fr 1.2fr;gap:20px;align-items:center}.grain-wrap svg{width:100%;max-height:230px}.switcher{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}.switcher button[aria-pressed=true]{background:var(--green);color:white}.recipe-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap}.recipe-head p{font-size:12px;color:var(--muted);margin:7px 0}.recipe-scale{font-size:12px}.recipe-scale select{margin-left:8px}.recipe-columns{display:grid;grid-template-columns:minmax(190px,.85fr) minmax(0,1.4fr);gap:30px;margin-top:20px}.ingredients{padding:0;list-style:none;font-size:14px}.ingredients li{display:flex;gap:14px;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0;margin:0}.ingredients li b{te </style></head><body><div id="app"></div><div id="printout"></div><dialog id="glossary" aria-labelledby="glossTitle"><div class="dialog-head"><h2 id="glossTitle">Begreper på kjøkkenet</h2><button id="closeGloss" aria-label="Lukk begrepslisten">✕</button></div><div id="terms"></div></dialog><dialog id="resetDialog" aria-labelledby="resetTitle"><h2 id="resetTitle">Nullstille arbeidet?</h2><p>Dette sletter svar, huskelister og framdrift i denne nettleseren. Last ned en reservefil med «Lagre svar» først hvis du vil beholde arbeidet.</p><div class="actions"><button id="cancelReset">Avbryt</button><button id="confirmReset" class="primary">Nullstill</button></div></dialog><input id="importFile" type="file" accept=".json,application/json" hidden><div id="toast" role="status" aria-live="polite" hidden></div><noscript>Denne læringsstien trenger JavaScript. Åpne filen i en vanlig nettleser med JavaScript aktivert.</noscript><script>const DATA={"lessons": [{"title": "Hva gir maten kroppen?", "short": "Næringsstoffer", "group": "Næringsstoffer", "lead": "Mat gir både energi og stoffer kroppen trenger for å vokse, reparere seg og fungere.", "body": "<section class=\"hero\"><div><span class=\"pill\">Mat og helse · 9. trinn<\/span><h2>Fra kunnskap<br>til kjøkken.<\/h2><p>Forstå hva maten gir deg. Øv på trygg matlaging. Bruk det du lærer i oppskriftene.<\/p><div class=\"badges\"><span class=\"pill\">Les<\/span><span class=\"pill\">Prøv selv<\/span><span class=\"pill\">Lag mat<\/span><\/div><\/div><svg viewBox=\"0 0 340 245\" role=\"img\" aria-label=\"En tallerken med grønnsaker, korn og fisk\"><circle cx=\"170\" cy=\"122\" r=\"113\" fill=\"#d4e2c1\"/><circle cx=\"170\" cy=\"122\" r=\"91\" fill=\"#fffdf6\" stroke=\"#b4c7a7\" stroke-width=\"2\"/><path d=\"M170 122V36A86 86 0 0 1 250 154Z\" fill=\"#e5c58a\"/><path d=\"M170 122L250 154A86 86 0 0 1 112 187Z\" fill=\"#dfb4a0\"/><path d=\"M170 122L112 187A86 86 0 0 1 170 36Z\" fill=\"#92b389\"/><g fill=\"#4b7852\"><circle cx=\"126\" cy=\"88\" r=\"15\"/><circle cx=\"145\" cy=\"103\" r=\"13\"/><circle cx=\"112\" cy=\"114\" r=\"13\"/><\/g><path d=\"M184 166q18-30 41-3q-20 25-41 3l-12 10v-23z\" fill=\"#ba7c67\"/><g stroke=\"#b89550\" stroke-width=\"4\"><path d=\"M198 70l22 20m-30-5l23 20m-8-40l25 21\"/><\/g><\/svg><\/section><section class=\"card \"><h2>Seks grupper næringsstoffer<\/h2><p>Et næringsstoff er et stoff i maten som kroppen trenger. Vi deler dem inn i seks grupper. En matvare inneholder vanligvis flere næringsstoffer.<\/p><div class=\"overflow\"><table><thead><tr><th scope=\"col\">Gruppe<\/th><th scope=\"col\">Eksempler på mat<\/th><th scope=\"col\">Viktig å huske<\/th><\/tr><\/thead><tbody><tr><td>Karbohydrater<\/td><td>Brød, havregryn, poteter og frukt<\/td><td>Gir energi. Fiber er også karbohydrat.<\/td><\/tr><tr><td>Proteiner<\/td><td>Fisk, kjøtt, egg, bønner og linser<\/td><td>Bygger opp og reparerer kroppen. Gir også energi.<\/td><\/tr><tr><td>Fett<\/td><td>Olje, nøtter, margarin og fet fisk<\/td><td>Gir energi og inngår i kroppens celler.<\/td><\/tr><tr><td>Vitaminer<\/td><td>Ulike matvarer, blant annet frukt og grønnsaker<\/td><td>Har ulike oppgaver. Gir ikke energi.<\/td><\/tr><tr><td>Mineraler<\/td><td>Blant annet melk, fisk og kornvarer<\/td><td>For eksempel kalsium, jern og jod. Gir ikke energi.<\/td><\/tr><tr><td>Vann<\/td><td>Drikke og mange matvarer<\/td><td>Nødvendig blant annet for transport i kroppen. Gir ikke energi.<\/td><\/tr><\/tbody><\/table><\/div><\/section><section class=\"card \"><h2>Energi er ikke et næringsstoff<\/h2><p>Karbohydrater, proteiner og fett er de <strong>energigivende<\/strong> næringsstoffene. Energi måles i kilokalorier (kcal) eller kilojoule (kJ). Vitaminer, mineraler og vann gir ikke energi, men er likevel nødvendige.<\/p><div class=\"callout\">Du skal kunne forklare med egne ord og gi eksempler. Du trenger ikke lære kjemiske strukturformler.<\/div><\/section><section class=\"card soft\"><h2>Slik bruker du læringsstien<\/h2><p>Les fagstoffet og løs oppgavene. Feil svar gir et hint, og du kan prøve igjen. På skriveoppgaver sammenligner du svaret ditt med et svarforslag og vurderer det selv.<\/p><p>Du kan bevege deg fritt mellom delene. Svar og framdrift lagres i denne nettleseren når lagring er tilgjengelig. Bruk «Lagre svar» for en reservefil. På delt PC: Last ned svarene og nullstill når du er ferdig.<\/p><\/section>", "source": "Karbohydrater, lysbilde 2. Vitaminer og mineraler + puresuppe, lysbilde 4. Forklaringene om protein, fett og vann er korte pedagogiske tillegg.", "qs": [{"id": "q1", "type": "match", "title": "Sorter de seks næringsstoffene.", "rows": ["Karbohydrater", "Proteiner", "Fett", "Vitaminer", "Mineraler", "Vann"], "options": ["Gir energi", "Gir ikke energi"], "correct": [0, 0, 0, 1, 1, 1], "why": "Karbohydrater, proteiner og fett gir energi. De tre andre gruppene gir ikke energi, men kroppen trenger dem likevel."}, {"id": "q2", "type": "mc", "title": "Hva er kcal?", "options": ["Et vitamin", "En måleenhet for energi", "En type protein"], "correct": 1, "why": "kcal betyr kilokalorier og er en måleenhet for energi.", "hint": "Se etter forskjellen mellom et stoff og det vi måler."}, {"id": "q3", "type": "text", "title": "Et måltid består av grovt brød, egg og et glass melk. Nevn minst tre næringsstoffer måltidet kan gi.", "model": "Brødet gir blant annet karbohydrater og fiber. Egget gir blant annet protein og fett. Melken gir blant annet protein og kalsium. Flere svar er mulige.", "criteria": ["Jeg nevner minst tre næringsstoffer.", "Jeg knytter næringsstoffene til matvarene."]}]}, {"title": "Karbohydrater og fiber", "short": "Karbohydrater", "group": "Næringsstoffer", "lead": "Sukker, stivelse og fiber hører til samme hovedgruppe, men oppfører seg forskjellig.", "body": "<section class=\"card \"><h2>Tre typer karbohydrater<\/h2><div class=\"grid3\"><div class=\"mini\"><h3>Sukkerarter<\/h3><p>Finnes naturlig blant annet i frukt og melk. Sukker kan også tilsettes, for eksempel i brus og godteri.<\/p><\/div><div class=\"mini\"><h3>Stivelse<\/h3><p>Finnes blant annet i poteter, ris, pasta og korn. Brytes ned til enkle sukkerenheter under fordøyelsen.<\/p><\/div><div class=\"mini\"><h3>Fiber<\/h3><p>Finnes blant annet i grove kornvarer, frukt og grønnsaker. Bidrar til metthet og til at tarmen fungerer.<\/p><\/div><\/div><p>Matvarer kan inneholde flere typer karbohydrater samtidig. Et eple inneholder for eksempel både sukkerarter og fiber.<\/p><\/section><section class=\"card \"><h2>Fra maten til cellene<\/h2><div class=\"flow\"><span>Stivelse i maten<\/span><b aria-hidden=\"true\">→<\/b><span>Enkle sukkerenheter<\/span><b aria-hidden=\"true\">→<\/b><span>Blodet og cellene<\/span><\/div><p>Enzymer bryter stivelse ned til mindre sukkerenheter, blant annet glukose. Disse tas opp fra tarmen til blodet. Insulin hjelper glukose fra blodet inn i cellene. Cellene kan bruke glukose som energi.<\/p><p>Kroppen mangler enzymene som bryter ned cellulose. Cellulose er en type fiber. Fiber har likevel viktige oppgaver i tarmen.<\/p><\/section><section class=\"card soft\"><h2>Se på hele matvaren<\/h2><p>Grovt brød og fullkornspasta gir fiber i tillegg til stivelse. Brus med sukker gir sukker, men lite av andre næringsstoffer. Frukt gir både sukkerarter, fiber, vitaminer og mineraler.<\/p><p>Det er derfor nyttig å vurdere hva hele matvaren bidrar med, og å variere det du spiser. Du skal ikke regne kalorier i denne læringsstien.<\/p><\/section>", "source": "Karbohydrater, lysbilde 3–12. Språket om sukker og matvalg er nyansert med utgangspunkt i Helsenorges kostråd.", "qs": [{"id": "q4", "type": "match", "title": "Koble beskrivelsen til riktig type.", "rows": ["Vanlig i poteter og ris", "Cellulose er et eksempel", "Kan tilsettes i brus"], "options": ["Sukker", "Stivelse", "Fiber"], "correct": [1, 2, 0], "why": "Poteter og ris inneholder stivelse. Cellulose er fiber. Sukker kan tilsettes i brus."}, {"id": "q5", "type": "mc", "title": "Hvilken forklaring på insulin er riktig?", "options": ["Insulin hjelper glukose fra blodet inn i cellene.", "Insulin er et annet navn på fiber.", "Insulin gjør alle karbohydrater om til vitaminer."], "correct": 0, "why": "Insulin er et hormon som bidrar til å regulere blodsukkeret.", "hint": "Tenk på hva som skjer etter at sukkerenhetene er tatt opp i blodet."}, {"id": "q6", "type": "mc", "title": "Hvorfor kan grovt brød være et godt valg til et måltid?", "options": ["Det inneholder ingen karbohydrater.", "Det gir blant annet stivelse og fiber.", "Det består bare av protein."], "correct": 1, "why": "Grovt brød gir både stivelse og fiber, og flere andre næringsstoffer.", "hint": "Karbohydrater omfatter mer enn sukker."}, {"id": "q7", "type": "text", "title": "En elev sier: «Fiber er unyttig fordi vi ikke kan bryte ned cellulose.» Forklar hvorfor påstanden er feil.", "model": "Fiber bidrar til metthet og til at tarmen fungerer. Vi trenger derfor fiber selv om vi ikke kan bryte ned cellulose med våre egne enzymer.", "criteria": ["Jeg forklarer minst én oppgave fiber har.", "Jeg skiller mellom fordøyelse av cellulose og nytten av fiber."]}]}, {"title": "Fett – energi og viktige oppgaver", "short": "Fett", "group": "Næringsstoffer", "lead": "Kroppen trenger fett. Her lærer du om oppgaver, matvarekilder og forskjellen på mettet og umettet fett.", "body": "<section class=\"card\"><h2>Hvorfor trenger vi fett?<\/h2><p>Fett er et energigivende næringsstoff. Det inngår også i kroppens celler og hjelper kroppen å ta opp de fettløselige vitaminene A, D, E og K.<\/p><p>Noen fettsyrer må vi få gjennom maten fordi kroppen ikke lager dem selv. Disse kalles essensielle fettsyrer. Det er derfor ikke et mål å fjerne alt fett fra kostholdet.<\/p><\/section><section class=\"card\"><h2>Mettet og umettet fett<\/h2><p>Fett i mat består av ulike fettsyrer. Vi skiller blant annet mellom mettet og umettet fett. En matvare inneholder ofte en blanding, men mengden av de ulike typene varierer.<\/p><div class=\"overflow\"><table><thead><tr><th>Type<\/th><th>Eksempler på kilder<\/th><\/tr><\/thead><tbody><tr><td>Mye umettet fett<\/td><td>Rapsolje, olivenolje, nøtter, frø, avokado og fet fisk.<\/td><\/tr><tr><td>Mye mettet fett<\/td><td>Smør, fløte, fete oster og flere fete kjøttprodukter. Kokosfett inneholder også mye mettet fett.<\/td><\/tr><\/tbody><\/table><\/div><p>Et praktisk kostråd er å velge planteoljer og myk margarin framfor smør og hard margarin. Hele kostholdet og variasjonen teller – ikke ett enkelt måltid.<\/p><\/section><section class=\"card\"><h2>Fett på skolekjøkkenet<\/h2><div class=\"grid2\"><div class=\"mini\"><h3>I purésuppen<\/h3><p>Oljen brukes til å surre løk og hvitløk. Olje bidrar med fett selv om den ikke ser ut som en fast klump.<\/p><\/div><div class=\"mini\"><h3>I kornet<\/h3><p>Kimen inneholder blant annet flerumettet fett. Havre har mer fett enn hvete, rug og bygg.<\/p><\/div><\/div><p>Fett bidrar også til smak og konsistens i maten. Du skal kjenne igjen kilder og forklare oppgavene – ikke regne ut ditt eget fettinntak.<\/p><\/section><section class=\"card\"><h2>Fet fisk og omega-3<\/h2><p>Laks, ørret, sild og makrell er eksempler på fet fisk. De gir marine omega-3-fettsyrer, som er en type flerumettet fett. Du møter forskjellen mellom fet og mager fisk i delen «Fisk og næringsstoffer».<\/p><\/section>", "source": "Korn, lysbilde 3 og 8. Karbohydrater, lysbilde 2. Vitaminer og mineraler + puresuppe, lysbilde 6, 8 og 17. Forklaringene om fett er utvidet med fagstoff fra Helsedirektoratet og Helsenorge. FISK, lysbilde 3–5.", "qs": [{"id": "q34", "type": "mc", "title": "Hvorfor trenger kroppen fett?", "options": ["Bare for at maten skal smake søtt.", "For å få energi, bygge celler og ta opp fettløselige vitaminer.", "Fett har ingen oppgaver i kroppen."], "correct": 1, "why": "Fett gir energi, inngår i celler og hjelper opptaket av A, D, E og K.", "hint": "Fett har flere oppgaver enn bare å gi energi."}, {"id": "q35", "type": "match", "title": "Koble matvaren til den fettypen den vanligvis har mye av.", "rows": ["Rapsolje", "Smør", "Nøtter", "Fløte"], "options": ["Umettet fett", "Mettet fett"], "correct": [0, 1, 0, 1], "why": "Rapsolje og nøtter har mye umettet fett. Smør og fløte har mye mettet fett. Alle kan inneholde flere fettyper."}, {"id": "q36", "type": "mc", "title": "Hvilken påstand om fett i maten er riktig?", "options": ["Alle matvarer fra planter inneholder bare umettet fett.", "En matvare kan inneholde både mettet og umettet fett.", "Fettløselige vitaminer er det samme som fett."], "correct": 1, "why": "Matvarer inneholder ofte en blanding av fettsyrer. Kokosfett er et eksempel på plantefett med mye mettet fett.", "hint": "Se på forskjellen mellom en hovedtype og en blanding av typer."}, {"id": "q37", "type": "text", "title": "En elev sier: «Vi bør fjerne alt fett fra purésuppen, for kroppen trenger ikke fett.» Forklar hvorfor det er feil, og nevn en kilde til umettet fett.", "model": "Kroppen trenger fett både som energikilde, som del av cellene og for å ta opp A, D, E og K. Rapsolje, olivenolje, nøtter og fet fisk er eksempler på kilder til umettet fett.", "criteria": ["Jeg forklarer minst to oppgaver fett har i kroppen.", "Jeg nevner en kilde til umettet fett."]}]}, {"title": "Proteiner – kroppens byggemateriale", "short": "Proteiner", "group": "Næringsstoffer", "lead": "Proteiner trengs til vekst og vedlikehold. Du finner dem både i mat fra dyr og i mat fra planter.", "body": "<section class=\"card\"><h2>Bygger opp og reparerer<\/h2><p>Kroppen bruker proteiner til å bygge opp og vedlikeholde blant annet muskler, hud og andre celler og vev. Proteiner er derfor viktige for alle, ikke bare for dem som trener mye.<\/p><p>Proteiner kan også gi energi. I denne læringsstien er hovedpoenget å kjenne oppgavene deres og finne vanlige matvarekilder.<\/p><\/section><section class=\"card\"><h2>Små byggesteiner blir til proteiner<\/h2><p>Proteiner består av byggesteiner som heter <strong>aminosyrer<\/strong>. Under fordøyelsen brytes proteinene i maten ned. Kroppen bruker aminosyrene til å bygge sine egne proteiner.<\/p><div class=\"flow\"><span>Protein i maten<\/span><b aria-hidden=\"true\">→<\/b><span>Aminosyrer<\/span><b aria-hidden=\"true\">→<\/b><span>Kroppens egne proteiner<\/span><\/div><p>Noen aminosyrer må vi få gjennom maten. De kalles essensielle aminosyrer. Et variert kosthold med ulike proteinkilder bidrar til å dekke behovet.<\/p><\/section><section class=\"card\"><h2>Hvor finner vi protein?<\/h2><div class=\"overflow\"><table><thead><tr><th>Type<\/th><th>Eksempler på kilder<\/th><\/tr><\/thead><tbody><tr><td>Mat fra dyr<\/td><td>Fisk, kjøtt, egg, melk, yoghurt og ost.<\/td><\/tr><tr><td>Mat fra planter<\/td><td>Bønner, linser, erter, soyaprodukter, nøtter og kornvarer.<\/td><\/tr><\/tbody><\/table><\/div><p>Både plantevarer og animalske matvarer kan bidra med protein. Tenk variasjon: Du kan for eksempel bruke linser i en suppe eller ha bønner ved siden av en grønnsaksrett.<\/p><\/section><section class=\"card\"><h2>Proteiner gjør også en jobb i matlaging<\/h2><div class=\"grid2\"><div class=\"mini\"><h3>Gluten i hvetedeig<\/h3><p>Gluten er proteiner som kan danne et elastisk nettverk. Nettverket holder på gassen fra gjæren.<\/p><\/div><div class=\"mini\"><h3>Når maten varmes<\/h3><p>Varme endrer formen til proteinene. Det ser du for eksempel når flytende eggehvite blir fast under steking.<\/p><\/div><\/div><p>I kjøttkakemåltidet bidrar kjøttdeigen med protein. Melken i kålstuingen og kornvarer i et måltid kan også bidra.<\/p><\/section><section class=\"card\"><h2>Både fet og mager fisk gir protein<\/h2><p>Torsk og laks har ulikt fettinnhold, men begge gir protein. Fisk kan derfor være en proteinkilde i taco, burger eller en middag med poteter og grønnsaker.<\/p><\/section>", "source": "Korn, lysbilde 3, 5 og 6. Karbohydrater, lysbilde 2. Kjøttkaker, lysbilde 7. Forklaringene om aminosyrer, oppgaver og proteinkilder er pedagogiske tillegg med supplerende ernæringsfaglige kilder. FISK, lysbilde 4 og 8.", "qs": [{"id": "q38", "type": "mc", "title": "Hva heter byggesteinene i proteiner?", "options": ["Vitaminer", "Aminosyrer", "Stivelse"], "correct": 1, "why": "Proteiner består av aminosyrer. Kroppen bruker dem til å bygge sine egne proteiner.", "hint": "Se på modellen som viser veien fra maten til kroppens egne proteiner."}, {"id": "q39", "type": "multi", "title": "Velg alle matvarene som bidrar med protein.", "options": ["Egg", "Linser", "Fisk", "Rent sukker"], "correct": [0, 1, 2], "why": "Egg, linser og fisk gir protein. Rent sukker er karbohydrat og er ikke en proteinkilde.", "hint": "Tre alternativer bidrar med protein. Husk at planter også kan gi protein."}, {"id": "q40", "type": "match", "title": "Koble proteineksemplet til det det bidrar til.", "rows": ["Protein i kroppen", "Glutennettverket i deigen", "Protein i eggehvite ved oppvarming"], "options": ["Endrer form slik at eggehviten stivner", "Holder på gass fra gjæren", "Bygger og vedlikeholder celler og vev"], "correct": [2, 1, 0], "why": "Protein har oppgaver både i kroppen og i matlaging. Gluten holder på gass, mens proteinene i eggehvite endrer form ved oppvarming."}, {"id": "q41", "type": "text", "title": "Du vil gjøre en grønnsakssuppe til et måltid med en tydelig proteinkilde. Foreslå én matvare fra planter eller dyr som passer, og forklar hvorfor kroppen trenger protein.", "model": "Jeg kan tilsette kokte linser eller bønner i suppen, eller servere egg ved siden av. Disse matvarene gir protein, som kroppen trenger til vekst, oppbygging og vedlikehold av celler og vev. Andre passende proteinkilder er også riktige.", "criteria": ["Jeg foreslår en passende proteinkilde.", "Jeg forklarer hvordan kroppen bruker proteiner."]}]}, {"title": "Fisk – protein, fett og mineraler", "short": "Fisk og næringsstoffer", "group": "Næringsstoffer", "lead": "Fisk gir flere næringsstoffer samtidig. Lær hvorfor det er nyttig å variere mellom fet og mager fisk.", "body": "<figure class=\"food- t<\/h2><p>Omega-3 er en gruppe flerumettede fettsyrer. Fet fisk bidrar med marine omega-3-fettsyrer. Disse inngår blant annet i kroppens celler og er viktige for normal utvikling og funksjon.<\/p><p>Fet fisk gir også vitamin D. Vitamin D hjelper kroppen å ta opp kalsium. Hvit fisk gir på sin side mye jod, som inngår i hormoner som regulerer stoffskiftet.<\/p><div class=\"callout\">Fisk er ikke bare fett: Både fet og mager fisk gir protein, og fisk kan også gi blant annet vitamin B12 og selen.<\/div><\/section><section class=\"card\"><h2>Variasjon i måltidene<\/h2><p>Kostrådene anbefaler fisk og sjømat til middag to til tre ganger i uken, og gjerne som pålegg. Varier mellom fet og mager fisk.<\/p><p>Du kan for eksempel prøve fiskeburger, laksetaco, laksewok eller fisk i ovn. Velg retter og tilbehør som passer gruppen.<\/p><p>Oppgitte gram- og porsjonsmengder i de nasjonale kostrådene gjelder voksne. Her øver du på variasjon og matvarekilder, ikke på å beregne ditt eget behov.<\/p><\/section>", "source": "FISK, lysbilde 3–9, inkludert næringsoversikten som bilde på lysbilde 4. Kostrådene er kontrollert mot Helsenorge. Skillet mellom fettinnhold og fiskefarge er presisert.", "qs": [{"id": "q42", "type": "match", "title": "Sorter fiskeslagene etter fettinnhold.", "rows": ["Laks", "Torsk", "Makrell", "Sei", "Sild", "Hyse"], "options": ["Fet fisk", "Mager fisk"], "correct": [0, 1, 0, 1, 0, 1], "why": "Laks, makrell og sild er fet fisk. Torsk, sei og hyse er mager fisk."}, {"id": "q43", "type": "match", "title": "Koble næringsstoffet til beskrivelsen.", "rows": ["Marine omega-3-fettsyrer", "Jod", "Protein"], "options": ["Bidrar til oppbygging og vedlikehold av kroppen", "Flerumettet fett som fet fisk bidrar med", "Mineral som hvit, mager fisk er en viktig kilde til"], "correct": [1, 2, 0], "why": "Omega-3 er fett. Jod er et mineral. Både fet og mager fisk gir protein."}, {"id": "q44", "type": "mc", "title": "Hvorfor er det nyttig å variere mellom fet og mager fisk?", "options": ["Fordi mager fisk ikke har næringsstoffer.", "Fordi de bidrar med ulike mengder fett, vitaminer og mineraler.", "Fordi alle fiskeslag inneholder nøyaktig det samme."], "correct": 1, "why": "Fet fisk gir særlig omega-3 og vitamin D. Hvit, mager fisk er en viktig jodkilde. Begge gir protein.", "hint": "Sammenlign næringsstoffene i tabellen over."}, {"id": "q45", "type": "text", "title": "Foreslå ett måltid med fet fisk og ett med mager fisk. Forklar ett viktig næringsbidrag fra hvert.", "model": "Jeg kan lage laksetaco: Laksen gir blant annet protein, omega-3 og vitamin D. Jeg kan også lage torsk i ovn med poteter og grønnsaker: Torsken gir protein og er en viktig kilde til jod. Andre passende fiskeslag og retter er også riktige.", "criteria": ["Jeg gir et eksempel på et måltid med fet fisk.", "Jeg gir et eksempel på et måltid med mager fisk.", "Jeg forklarer et viktig næringsbidrag fra hver fisketype."]}]}, {"title": "Vitaminer og mineraler", "short": "Vitaminer og mineraler", "group": "Næringsstoffer", "lead": "Små mengder kan ha stor betydning. Her øver du på matvarekilder og oppgaver i kroppen.", "body": "<section class=\"card \"><h2>Vitaminer har ulike oppgaver<\/h2><p>Vi trenger flere ulike vitaminer. De bidrar blant annet til normal vekst, syn og et normalt immunforsvar. Et variert kosthold gir flere ulike vitaminer.<\/p><div class=\"overflow\"><table><thead><tr><th scope=\"col\">Gruppe<\/th><th scope=\"col\">Vitaminer<\/th><th scope=\"col\">Hva betyr det?<\/th><\/tr><\/thead><tbody><tr><td>Fettløselige<\/td><td>A, D, E og K<\/td><td>Kan lagres i kroppen, blant annet i lever og fettvev.<\/td><\/tr><tr><td>Vannløselige<\/td><td>B-vitaminene og vitamin C<\/td><td>Mange lagres i liten grad. B12 er et viktig unntak og kan lagres lenge.<\/td><\/tr><\/tbody><\/table><\/div><p>Vi trenger vitaminer gjennom kosten. Kroppen kan også lage vitamin D i huden ved sollys. Påstanden «kroppen lager ingen vitaminer» blir derfor for enkel.<\/p><\/section><section class=\"card \"><h2>Tre mineraler du skal kjenne<\/h2><div class=\"overflow\"><table><thead><tr><th scope=\"col\">Mineral<\/th><th scope=\"col\">Oppgave<\/th><th scope=\"col\">Eksempler på kilder<\/th><\/tr><\/thead><tbody><tr><td>Jern<\/td><td>Viktig for transport av oksygen i blodet<\/td><td>Kjøtt, grove kornvarer og grønne grønnsaker<\/td><\/tr><tr><td>Kalsium<\/td><td>Viktig for skjelett, muskler og nerver<\/td><td>Melk, ost og yoghurt<\/td><\/tr><tr><td>Jod<\/td><td>Inngår i hormoner som regulerer stoffskiftet<\/td><td>Hvit fisk, melk og egg<\/td><\/tr><\/tbody><\/table><\/div><\/section><section class=\"card \"><h2>Næringsstoffer samarbeider<\/h2><div class=\"grid2\"><div class=\"mini\"><h3>Vitamin C + jern<\/h3><p>Vitamin C hjelper kroppen å ta opp jern fra plantevarer. Et eksempel er frukt eller paprika sammen med grovt brød.<\/p><\/div><div class=\"mini\"><h3>Vitamin D + kalsium<\/h3><p>Vitamin D hjelper kroppen å ta opp kalsium fra tarmen. Kalsium er viktig for skjelettet.<\/p><\/div><\/div><\/section><section class=\"card soft\"><h2>Bevar vitaminene under matlaging<\/h2><ul><li>Skyll grønnsakene før bruk.<\/li><li>Behold skallet når det passer, eller skrell tynt.<\/li><li>Bruk lite kokevann eller damp grønnsakene.<\/li><li>Ha lokket på og unngå å koke for lenge.<\/li><\/ul><p>I suppe spiser du også kokevæsken. Da får du med vannløselige stoffer som har gått over i vannet.<\/p><\/section><section class=\"card\"><h2>Fisk gir ulike vitaminer og mineraler<\/h2><p>Fet fisk er en viktig kilde til vitamin D. Hvit, mager fisk er en viktig kilde til jod. Fisk kan også gi vitamin B12 og selen. Næringsinnholdet varierer mellom fiskeslag.<\/p><\/section>", "source": "Vitaminer og mineraler + puresuppe, lysbilde 5–14. Grønnsakslapskaus, lysbilde 3–5. Unntakene for vitamin D og B12 er faglige presiseringer. FISK, lysbilde 4–6.", "qs": [{"id": "q8", "type": "match", "title": "Hvilket mineral passer til oppgaven?", "rows": ["Transportere oksygen i blodet", "Bygge et sterkt skjelett", "Inngå i stoffskiftehormoner"], "options": ["Jod", "Jern", "Kalsium"], "correct": [1, 2, 0], "why": "Jern hjelper oksygentransporten, kalsium er viktig for skjelettet, og jod inngår i stoffskiftehormoner."}, {"id": "q9", "type": "match", "title": "Sorter vitaminene.", "rows": ["A", "C", "D", "B", "E", "K"], "options": ["Fettløselig", "Vannløselig"], "correct": [0, 1, 0, 1, 0, 0], "why": "A, D, E og K er fettløselige. B og C er vannløselige."}, {"id": "q10", "type": "mc", "title": "Du skal koke grønnsaker. Hva bevarer vanligvis vitaminene best?", "options": ["Koke lenge i mye vann.", "Skrelle tykt og koke uten lokk.", "Bruke lite vann, lokk og passe koketid."], "correct": 2, "why": "Bruk lite vann og unngå unødvendig lang koking.", "hint": "Tenk på både vannmengden og hvor lenge grønnsakene varmes."}, {"id": "q11", "type": "text", "title": "Hvorfor kan paprika på en grov brødskive være en nyttig kombinasjon?", "model": "Grovt brød gir jern fra planter. Paprika gir vitamin C, som hjelper kroppen å ta opp dette jernet.", "criteria": ["Jeg knytter jern til grovt brød.", "Jeg forklarer hvordan vitamin C hjelper jernopptaket."]}]}, {"title": "Kornet fra innsiden", "short": "Korn og baking", "group": "Næringsstoffer", "lead": "Skall, kjerne og kime bidrar med ulike næringsstoffer. Hele kornet har mye å by på.", "body": "<section class=\"card \"><h2>Utforsk et korn<\/h2><p>Velg en del av kornet for å se hva den inneholder. Modellen er en forenklet skisse.<\/p><div class=\"grain-wrap\"><svg viewBox=\"0 0 300 210\" role=\"img\" aria-label=\"Forenklet korn med skall ytterst, kjerne i midten og kime nederst\"><ellipse cx=\"150\" cy=\"103\" rx=\"79\" ry=\"96\" fill=\"#b99150\"/><ellipse cx=\"150\" cy=\"103\" rx=\"63\" ry=\"80\" fill=\"#f0d99e\"/><ellipse cx=\"159\" cy=\"158\" rx=\"26\" ry=\"24\" fill=\"#91ad79\"/><path d=\"M226 66h54M209 108h71M185 163h95\" stroke=\"#315c43\" stroke-width=\"2\"/><text x=\"252\" y=\"59\" font-size=\"13\">Skall<\/text><text x=\"238\" y=\"100\" font-size=\"13\">Kjerne<\/text><text x=\"248\" y=\"185\" font-size=\"13\">Kime<\/text><\/svg><div><div class=\"switcher\" role=\"group\" aria-label=\"Velg del av kornet\"><button data-grain=\"0\" aria-pressed=\"true\">Skall<\/button><button data-grain=\"1\" aria-pressed=\"false\">Kjerne<\/button><button data-grain=\"2\" aria-pressed=\"false\">Kime<\/button><\/div><p id=\"grainText\" role=\"status\">Skallet gir mye fiber. I overgangen mellom skall og kjerne finnes blant annet B-vitaminer, mineraler og protein.<\/p><\/div><\/div><\/section><section class=\"card \"><h2>Korn i maten<\/h2><p>Hvete, rug, havre, bygg, ris og mais er kornsorter. Korn gir blant annet karbohydrater, protein, fett, vitaminer og mineraler.<\/p><p>I fullkorn brukes alle delene av kornet. Derfor bidrar fullkornsprodukter med fiber og næringsstoffer fra både skall, kjerne og kime.<\/p><\/section><section class=\"card \"><h2>Hva skjer i bakst og saus?<\/h2><div class=\"grid2\"><div class=\"mini\"><h3>Gluten holder på gass<\/h3><p>Når hvetedeig eltes, kan gluten danne et elastisk nettverk. Det holder på gassen fra gjæren, slik at deigen hever.<\/p><\/div><div class=\"mini\"><h3>Stivelse binder vann<\/h3><p>Når stivelse varmes opp med vann, sveller den og blandingen blir tykkere. Dette kalles forklistring. Det er nyttig i blant annet sauser.<\/p><\/div><\/div><\/section>", "source": "Korn, lysbilde 2–9. Fullkorn er forklart som et pedagogisk tillegg i tråd med kostrådene.", "qs": [{"id": "q12", "type": "match", "title": "Hvor i kornet finner du dette?", "rows": ["Mye fiber", "Mye stivelse og protein", "Blant annet flerumettet fett og vitamin E"], "options": ["Kime", "Skall", "Kjerne"], "correct": [1, 2, 0], "why": "Skallet gir fiber, kjernen er rik på stivelse og protein, og kimen inneholder blant annet fett og vitamin E."}, {"id": "q13", "type": "mc", "title": "Hva gjør glutennettverket i en hvetedeig?", "options": ["Holder på gassen fra gjæren.", "Fjerner alle karbohydratene.", "Gjør at deigen ikke trenger varme."], "correct": 0, "why": "Et elastisk glutennettverk holder på gassen og hjelper deigen å heve.", "hint": "Tenk på små gassbobler inne i deigen."}, {"id": "q14", "type": "text", "title": "En hvit saus tykner når den koker opp. Forklar hva stivelsen i melet gjør.", "model": "Stivelsen binder vann og sveller ved oppvarming. Blandingen tykner. Dette kalles forklistring.", "criteria": ["Jeg forklarer at stivelse binder vann ved oppvarming.", "Jeg bruker eller forklarer ordet forklistring."]}]}, {"title": "Start med rene hender", "short": "Personlig hygiene", "group": "Hygiene", "lead": "God hygiene handler om vaner du bruker hver gang du lager mat.", "body": "<section class=\"card \"><h2>Før du starter<\/h2><ul><li>Vask hendene godt med såpe og vann.<\/li><li>Ta på et rent forkle og sett opp langt hår.<\/li><li>Fjern ringer og armbånd, og ha korte negler.<\/li><li>Gjør arbeidsbenken ren og finn fram rent utstyr.<\/li><\/ul><p>Vask hendene igjen etter toalettbesøk, hosting og håndtering av rått kjøtt eller rå fisk. Unngå å ta deg i ansiktet og håret under matlaging.<\/p><\/section><section class=\"card \"><h2>Stopp, vask, fortsett<\/h2><div class=\"scenario\"><span class=\"section-label\">På skolekjøkkenet<\/span><h3>Du har blandet rå kjøttdeig. Nå vil du skjære brød.<\/h3><p>Hendene kan overføre bakterier. Vask hendene før du tar på brødet og det rene utstyret.<\/p><\/div><p>Smak med ren skje og smaksskål. En skje som har vært i munnen, skal ikke tilbake i gryten. Ikke sitt på arbeidsbenken.<\/p><\/section><section class=\"card soft\"><h2>Samarbeid om et rent kjøkken<\/h2><p>Rydd underveis. Skyll kluten etter bruk og heng den opp. Vask benken når det trengs, ikke bare når timen er over.<\/p><p>Ved oppkast eller diaré skal du ikke lage mat til andre. Følg lærerens rutiner ved sykdom og sår på hendene.<\/p><\/section>", "source": "Trygg mat, lysbilde 3–4 og 8–9. Presiseringer om sykdom følger Mattilsynets hygieneråd.", "qs": [{"id": "q15", "type": "mc", "title": "Du har tatt på rå kjøttdeig. Hva gjør du før du skjærer brød?", "options": ["Tørker hendene på forkleet.", "Vasker hendene og bruker rent utstyr.", "Skyller bare kniven og fortsetter."], "correct": 1, "why": "Håndvask og rent utstyr hindrer at bakterier overføres til brødet.", "hint": "Både hender og utstyr kan overføre bakterier."}, {"id": "q16", "type": "multi", "title": "Velg alle gode hygienerutiner.", "options": ["Sette opp langt hår", "Smake flere ganger med samme brukte skje i gryten", "Fjerne ringer før matlaging", "Rydde og vaske underveis"], "correct": [0, 2, 3], "why": "Oppsatt hår, rene hender uten ringer og en ryddig arbeidsplass bidrar til god hygiene. Bruk ren skje ved smaking.", "hint": "Tre av rutinene er gode. Tenk særlig på skjeen som har vært i munnen."}, {"id": "q17", "type": "order", "title": "Sett oppvasken i riktig rekkefølge.", "items": ["Skrap av matrester og skyll utstyret.", "Vask med oppvaskmiddel og oppvaskkost.", "Skyll bort såperestene.", "Tørk med rent håndkle og sett tørt utstyr på plass."], "why": "Rekkefølgen er skyll – vask – skyll – tørk. Vask det mest skitne utstyret sist, og skift skittent oppvaskvann."}, {"id": "q18", "type": "text", "title": "En medelev hoster i hånden og vil deretter legge salat på tallerkenene. Hva sier du, og hvorfor?", "model": "Jeg ber eleven vaske hendene før hen tar på salaten. Hendene kan overføre bakterier til mat som skal spises uten ny varmebehandling.", "criteria": ["Jeg foreslår håndvask før eleven fortsetter.", "Jeg forklarer at bakterier kan overføres til maten."]}]}, {"title": "Hold maten trygg", "short": "Matvarehygiene", "group": "Hygiene", "lead": "Råvarer, temperatur og rene redskaper henger sammen. Her får du øve på kjøkkenvalg.", "body": "<section class=\"card \"><h2>Hold rå og ferdig mat adskilt<\/h2><p>Rått kjøtt og rå fisk skal holdes unna mat som er ferdig til å spises. Bruk egne, rene skjærebrett og kniver til rått kjøtt, fisk og grønnsaker. Dette forebygger kryssforurensning: at bakterier flyttes fra én matvare eller overflate til en annen.<\/p><p>Skyll frukt og grønnsaker godt i kaldt vann. Del purre på langs slik at du kommer til mellom lagene og får skylt bort jorden.<\/p><\/section><section class=\"card \"><h2>Temperatur og oppbevaring<\/h2><div class=\"grid2\"><div class=\"mini\"><h3>Kaldt<\/h3><p>Kjøleskapet bør holde under 4 °C. Følg også oppbevaringsmerkingen på matvaren.<\/p><\/div><div class=\"mini\"><h3>Varmt<\/h3><p>Mat som skal holdes varm før servering, bør holdes over 60 °C. Dette er varmholding, ikke en garanti for at rå mat er ferdig tilberedt.<\/p><\/div><\/div><p>Mat som skal spises senere, må kjøles raskt ned. Fordel i mindre porsjoner og bruk gjerne kaldt vannbad. Sett maten kjølig etter rask nedkjøling. Ikke la en stor gryte stå lenge på benken og vente på å bli kald.<\/p><p class=\"source-note\">Faglig presisering av lysbilde 7 i «Trygg mat», med utgangspunkt i Mattilsynets temperaturveiledning.<\/p><\/section><section class=\"card soft\"><h2>Se, lukt og les merkingen<\/h2><p>Se på matvaren og les dato og oppbevaringsmerking. Lukt og utseende kan si noe om kvalitet, men kan ikke alltid avsløre farlige bakterier. Lukt alene beviser derfor ikke at maten er trygg.<\/p><p>Gjennomstek kjøttkaker, og følg oppskrift og lærerens rutiner. Vask hendene og rengjør utstyret etter kontakt med rå kjøttdeig.<\/p><\/section><section class=\"card\"><h2>Egne rutiner for fisk<\/h2><ul><li>Hold fisken kald og ta den fram når du skal arbeide med den.<\/li><li>Bruk eget rent skjærebrett og egen kniv. I fiskepresentasjonen brukes blått brett.<\/li><li>Vask hendene og utstyret etter håndtering av rå fisk.<\/li><li>Hold rå fisk unna salat og annen mat som er klar til å spises.<\/li><\/ul><p>Fargen på brettet er en praktisk avtale på skolekjøkkenet. Følg lærerens system; fargen alene gjør ikke utstyret rent.<\/p><\/section><section class=\"card\"><h2>Kan all fersk fisk spises rå?<\/h2><p>Nei. Ferskhet alene er ikke nok. Rå fisk krever egnede råvarer, god kjøling og god hygiene. Noen fiskeslag kan ha parasitter og må som hovedregel frysebehandles dersom de skal spises rå eller nesten rå.<\/p><p>Det finnes unntak, blant annet for oppdrettslaks og regnbueørret som oppfyller vilkårene. Følg lærerens valg av råvare og rutiner. Denne læringsstien er ikke en framgangsmåte for å lage rå fisk.<\/p><p class=\"source-note\">Presisering av formuleringen på lysbilde 2 i FISK.pptx, med grunnlag i Mattilsynets råd.<\/p><\/section>", "source": "Trygg mat, lysbilde 6–7. Grønnsakslapskaus, lysbilde 6–8. Temperatur, nedkjøling og vurdering av mat er presisert med Mattilsynets råd. FISK, lysbilde 2. Påstanden om rå fisk er presisert med Mattilsynets råd om sushi og parasitter.", "qs": [{"id": "q19", "type": "mc", "title": "Du har kuttet rå kylling. Hvilket valg er best før du kutter salat?", "options": ["Bruke samme brett fordi alt skal på samme tallerken.", "Skrape av brettet med kniven.", "Vaske hendene og bruke et rent brett og en ren kniv."], "correct": 2, "why": "Salat skal ofte spises rå. Rene hender og rent utstyr hindrer overføring av bakterier.", "hint": "Salaten får ingen varmebehandling etterpå."}, {"id": "q20", "type": "number", "title": "Hvilken øvre temperaturgrense bruker vi som hovedregel for kjølevarer? Skriv tallet.", "value": 4, "unit": "°C", "why": "Hovedregelen er 4 °C eller lavere for lettbedervelige kjølevarer, og kjøleskapet bør holde under 4 °C. Følg merkingen."}, {"id": "q21", "type": "mc", "title": "En stor gryte suppe skal brukes senere. Hva er best?", "options": ["La den stå på benken hele ettermiddagen.", "Fordele suppen i mindre porsjoner og kjøle raskt ned, gjerne i kaldt vannbad.", "Holde den lunken fram til neste dag."], "correct": 1, "why": "Mindre porsjoner og kaldt vannbad gjør nedkjølingen raskere. Deretter oppbevares maten kjølig.", "hint": "Tenk på hvordan du får temperaturen raskt ned i hele suppen."}, {"id": "q22", "type": "text", "title": "Hvorfor er «maten lukter fint» ikke nok til å vite at den er trygg?", "model": "Farlige bakterier kan være til stede uten at vi merker dem på lukt eller utseende. Vi må også følge hygienerutiner, oppbevaringsmerking og trygg temperatur.", "criteria": ["Jeg forklarer at bakterier ikke alltid kan oppdages med sansene.", "Jeg nevner minst én annen ting vi må kontrollere."]}, {"id": "q46", "type": "mc", "title": "Fisken er fersk. Betyr det automatisk at den kan spises rå?", "options": ["Ja, så lenge den lukter fint.", "Nei. Vi må også vurdere råvare, kjøling, hygiene og parasittrisiko.", "Ja, hvis den skjæres på et blått brett."], "correct": 1, "why": "Ferskhet alene avgjør ikke om fisk kan spises rå. Egnede råvarer og riktige rutiner er nødvendige.", "hint": "Tenk på hva vi ikke kan avgjøre bare ved å lukte på maten."}, {"id": "q47", "type": "multi", "title": "Velg alle riktige rutiner når dere lager fisk.", "options": ["Holde fisken kald fram til bruk", "Bruke eget rent brett og egen kniv", "Bruke samme urene brett til rå fisk og ferdig salat", "Vaske hendene etter håndtering av rå fisk"], "correct": [0, 1, 3], "why": "Kjøling, rent utstyr og håndvask er viktige. Rå fisk og ferdig salat skal holdes adskilt.", "hint": "Tre valg er riktige. Se etter valget som kan overføre bakterier til salaten."}]}, {"title": "Lag grønnsakslapskaus", "short": "Grønnsakslapskaus", "group": "Oppskrifter", "lead": "Bruk næringskunnskap og hygienerutiner mens du planlegger en enkel grønnsaksrett.", "body": "<figure class=\"food-photo\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAARMAAAC3CAIAAAC+MS2jAAAgAElEQVR4AXS8d3iU94Euyjl3773Zze4m2WyyycZx4sSJG9gYY7ApAWwDxiUGbGMMNtj0jur0Xr9e55veRxr1joREFUUU0QWSkIR6Rb2NNP13ntHck/vX0TPP/DHSzEjP83vnrZ8WpR7bJxekuC20lUWNpN5Mw1kODtVIshycAdd6bSwFK3VyPq6TXTpbcuPy2dde/G9xyom6c1VGVA/LRG6OhmUiMw4zejUsE2FKafLmMlA5djMLaUiNDJELCbUUV0lonUInzsyxGy0ElHw8z2kWpxyDZYJchynt8I+MXlldlHfv6qVsq9FnNvz9w3Wrly6eGugxYZBWxKsqyMm2Gu00nu+yuTm6IjdLmnaiwG2FZJmVBV6/ndVKMn1W1m2ivBamuqzA77Lk+lxumyk/2+Oxm3N8bpu n lagres lenge. Velg grønnsaker sammen med læreren, og bruk det dere har tilgjengelig.<\/p><p>Lag en stødig skjæreflate før du kutter. Hold fingertuppene unna kniveggen. Jevnstore biter blir lettere ferdige samtidig.<\/p><\/section><div class=\"recipe-slot\" data-recipe=\"lapskaus\"><\/div><section class=\"card \"><h2>Koble teori og praksis<\/h2><div class=\"grid2\"><div class=\"mini\"><h3>Hygiene<\/h3><p>Skyll bort jord før grønnsakene kuttes. Hold rått kjøtt og fisk unna grønnsaker som skal spises uten oppvarming.<\/p><\/div><div class=\"mini\"><h3>Næringsstoffer<\/h3><p>Grønnsaker bidrar blant annet med fiber, vitaminer og mineraler. Poteter, hvis dere bruker det, gir også stivelse.<\/p><\/div><\/div><\/section>", "source": "Grønnsakslapskaus, lysbilde 5–9. Kulturperspektivet er også omtalt i Vitaminer og mineraler + puresuppe, lysbilde 2.", "qs": [{"id": "q23", "type": "order", "title": "Sorter hovedtrinnene i lapskausen.", "items": ["Vask og rens grønnsakene.", "Kutt grønnsakene og legg dem i gryten.", "Tilsett vann og buljong.", "Kok til grønnsakene er møre.", "Smak til og server."], "why": "Rene råvarer og kutting kommer først. Smak til når retten er ferdig kokt."}, {"id": "q24", "type": "mc", "title": "Hvorfor bør grønnsaksbitene være omtrent like store?", "options": ["Da får de omtrent lik koketid.", "Da forsvinner alle bakterier med en gang.", "Da trenger du aldri å vaske dem."], "correct": 0, "why": "Jevnstore biter blir lettere ferdige samtidig.", "hint": "Tenk på forskjellen mellom en stor potetbit og en veldig liten bit."}, {"id": "q25", "type": "text", "title": "Dere har gulrøtter til overs. Foreslå hvordan de kan brukes i lapskausen, og beskriv én hygienerutine og ett valg som bevarer vitaminer.", "model": "Vi kan vaske og rense gulrøttene, kutte dem i jevnstore biter og koke dem med de andre grønnsakene. Vi skyller bort jord. Vi bruker lokk, ikke mer vann enn nødvendig og unngår å overkoke.", "criteria": ["Jeg foreslår en praktisk bruk av gulrøttene.", "Jeg beskriver én hygienerutine.", "Jeg nevner ett valg som bevarer vitaminer."]}]}, {"title": "Én metode, fire supper", "short": "Purésupper", "group": "Oppskrifter", "lead": "Bytt grønnsak og smak, men bruk den samme grunnmetoden.", "body": "<figure class=\"food-photo\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEBLAEsAAD/4QDsRXhpZgAATU0AKgAAAAgABAEPAAIAAAAFAAAAPgEQAAIAAAAKAAAAQ4KaAAUAAAABAAAATYdpAAQAAAABAAAAVQAAAABTT05ZAElMQ0UtN1JNNAAAAAABAAAAoAAHgpoABQAAAAEAAACrgp0ABQAAAAEAAACziCcAAwAAAAEAyAAAkAMAAgAAABQAAAC7kgkAAwAAAAEAEAAAkgoABQAAAAEAAADPpDQAAgAAAA0AAADXAAAAAQAAAKAAAAAjAAAACjIwMjA6MDI6MjAgMDk6NDk6MjMAAAADUgAAAApGRSA4NW1tIEYxLjgA/9sAQwADAgICAgIDAgICAwMDAwQGBAQEBAQIBgYFBgkICgoJCAkJCgwPDAoLDgsJCQ0RDQ4PEBAREAoMEhMSEBMPEBAQ/9sAQwEDAwMEAwQIBAQIEAsJCxAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQ/8AAEQgCjAPAAwEiAAIRAQMRAf/EAB0AAAEEAwEBAAAAAAAAAAAAAAUEBgMHCAIBAAn/xABNEAACAQMDAgQEAwUGBQMCAA8BAgMEEQUAIRIGMUETB1EiYXEUMoEIkSNCoRXBsVLRM+FiFvAkcvGCQwkXkqIlNGNEUxhz0lR0k7LC/8QAHAEAAgMBAQEBAAAAAAAAAAAAAgMEAQUABgcI/8QAQhEAAQMDAgMFBwMDAwQBAwUBAQIAAxEEITESBUFRYRNxgSKRofDRsQYywRThI0LxUhUHYiQzcpIWQ7IXNIKDosL/2gAMAwEAAhEDEQA/AHi0paKYyuEcC4N7C2g+IyE1NVPUwFKlhf8AEL29tIhi67IBqvJ1jX/+OOM7W09encLDHRLF9ndE/wBQ9jbTaEqqxqAlocVRVGfp5P6jGfuUJeSwKqF8LaM0HTePxdOaiSBF7Hk22iFRVY+gnFTRlfhj4S7bfXQfIVddnJYqKlEpgvdnPa3ho+XqYHJ9LSZWqkyXmUeOp1YcdmI2Hvpr0uLyM1VEpCxRK4G/4mGrAqaShw2NVImDSybElv56Z+Raamo5WiJaSQ/CSbcdUrq7SWSq58Zi6Vnd0Rrb27jTXg6lqK2uelx8LyBkJVzc2OkWM6by1XUCPLVUg+LbzD+IH2GrLx3TuJwVMkwhVTb8bdzqhU5DKoThsfE9IT+Y2S6gqGa+6oT39tE8p1HQdN0/kxSWlYALFGAT+ftojk63+rzrT0ULqIzyLHsdC8R0Sksk+SzMhuWJPL20O3Z+LLfv/MsbXLmuo6eAnzgGBvEu2x8DoziukIMRSq1REF2vw8b6UxdT4jFc4KP42jPFAvxaQ1mbr83ISWWALYi2iIANSwrXAcmRqVFwpKINrf4ToRNTslODHGjyk8ie5tpWnlyl5GlMhYksvgSNJp6irmcvTQBFQcQSO+uJzl2ASMMZkcmYpYldQ1luQew/LQylyObzGR8imUUcMexYnd1+X+2imPx8tXWg1SggElgw7nSiox601Z5vmKlxYfTVZVkPsDD0kxKGpikqZBLD2YsfH30beFQYvtyA0YtwUd9NrLVq4+GONy8r8/h4G9x89KsPk55ayOqybeRTx3+FR8RFu+uwD4u8kOxsNjhDSNUZFyt1JAt2HidBa3rNM espinner er nevnt som tilbehør i presentasjonen, men det følger ingen oppskrift på dem i kildene.<\/p><\/section>", "source": "Vitaminer og mineraler + puresuppe, lysbilde 15–18.", "qs": [{"id": "q26", "type": "order", "title": "Sett hovedtrinnene for purésuppe i rekkefølge.", "items": ["Skyll, rens og del opp grønnsakene.", "Surr løk og hvitløk i olje.", "Tilsett grønnsaker, vann og buljong.", "Kok til grønnsakene er møre, og mos suppen.", "Tilsett melk eller fløte, juster og smak til."], "why": "Grønnsakene klargjøres først, så bygges smaken opp. Suppen moses når grønnsakene er møre."}, {"id": "q27", "type": "number", "title": "Grunnoppskriften har cirka 300 g grønnsaker. Hvor mye trenger du til dobbel oppskrift?", "value": 600, "unit": "g", "why": "300 g × 2 = 600 g. Du må doble de andre mengdene også."}, {"id": "q28", "type": "mc", "title": "Suppen er blitt for tykk. Hva gjør du?", "options": ["Tilsetter litt vann og vurderer konsistensen på nytt.", "Tilsetter mer maisjevner med en gang.", "Kaster suppen og starter på nytt."], "correct": 0, "why": "Litt vann gjør suppen tynnere. Tilsett gradvis og vurder underveis.", "hint": "Maisjevner gjør vanligvis suppen tykkere."}, {"id": "q29", "type": "text", "title": "Planlegg en gulrot- og ingefærsuppe for gruppen. Fordel minst tre arbeidsoppgaver, og nevn én rutine dere må huske når dere bruker stavmikseren.", "model": "Én vasker og kutter grønnsakene. Én måler opp væske og buljong og passer kjelen. Én gjør klar utstyr og bord og hjelper med rydding. Før mosing av varm suppe følger vi lærerens rutiner, holder mikserhodet nede i suppen og håndterer utstyret slik at det ikke spruter.", "criteria": ["Jeg fordeler minst tre konkrete arbeidsoppgaver.", "Jeg beskriver trygg bruk av stavmikser ved varm suppe."]}]}, {"title": "Kjøttkaker med tilbehør", "short": "Kjøttkaker og tilbehør", "group": "Oppskrifter", "lead": "Avslutt med å samle næringsstoffer, hygiene og samarbeid i et tradisjonelt måltid.", "body": "<figure class=\ <\/h2><p>Kjøttkaker med brun saus, kokte poteter og kålstuing er norsk tradisjonsmat. Tradisjonsmat forteller om råvarer, klima og måter å ta vare på maten på.<\/p><p>Måltidet gir ulike næringsstoffer: kjøttet bidrar med blant annet protein og jern, potetene med stivelse, kålen med blant annet fiber og vitaminer, og melken i stuingen med kalsium.<\/p><p>Les alle oppskriftene før dere starter. Fordel arbeidet slik at delene blir ferdige omtrent samtidig.<\/p><\/section><div class=\"recipe-slot\" data-recipe=\"kjott\"><\/div><div class=\"recipe-slot\" data-recipe=\"potet\"><\/div><div class=\"recipe-slot\" data-recipe=\"kal\"><\/div><section class=\"card \"><h2>Forslag til arbeidsfordeling<\/h2><div class=\"grid2\"><div class=\"mini\"><h3>Gruppe på fire<\/h3><p>1: Poteter og kål.<br>2: Kjøttkaker.<br>3: Brun saus.<br>4: Hvit saus til kålstuingen.<\/p><\/div><div class=\"mini\"><h3>Gruppe på tre<\/h3><p>1: Poteter og hvit saus.<br>2: Kjøttkaker.<br>3: Brun saus og kutting av kål.<\/p><\/div><\/div><p>Avtal hvem som rydder, tar oppvasken og følger med på tidene. Vask hendene og bytt til rent utstyr etter rå kjøttdeig.<\/p><\/section>", "source": "Kjøttkaker, lysbilde 4–9. Oppskriftene er skrevet av fra bildene og framgangsmåten er språklig tilpasset.", "qs": [{"id": "q30", "type": "number", "title": "Oppskriften til to porsjoner bruker 250 g kjøttdeig. Hvor mye trengs til seks porsjoner?", "value": 750, "unit": "g", "why": "Seks porsjoner er tre ganger to porsjoner. 250 g × 3 = 750 g."}, {"id": "q31", "type": "mc", "title": "Hvordan tilsetter du melken i den hvite sausen?", "options": ["Alt på én gang uten å røre.", "Litt etter litt, med god røring mellom hver gang.", "Først etter at kålen er servert."], "correct": 1, "why": "Spe litt etter litt og rør godt for å få en jevn saus.", "hint": "Tenk på hvordan du kan unngå klumper."}, {"id": "q32", "type": "match", "title": "Koble råvaren til et næringsstoff den bidrar med.", "rows": ["Kjøttdeig", "Poteter", "Melk i kålstuingen", "Kål"], "options": ["Kalsium", "Fiber", "Protein og jern", "Stivelse"], "correct": [2, 3, 0, 1], "why": "Matvarer inneholder flere næringsstoffer. Her har vi valgt ett eller to typiske bidrag fra hver råvare."}, {"id": "q33", "type": "text", "title": "Lag en kort plan for måltidet: én ting om næringsstoffer, to hygienerutiner og én måte å samarbeide godt på.", "model": "Kjøttkaker gir blant annet protein og jern, og poteter gir stivelse. Vi vasker hendene etter rå kjøttdeig og bruker rent utstyr til ferdig mat. Vi leser oppskriftene først, fordeler oppgavene og sier fra til hverandre om hva som er klart.", "criteria": ["Jeg knytter en råvare til et næringsstoff.", "Jeg beskriver to relevante hygienerutiner.", "Jeg foreslår en konkret måte å samarbeide på."]}]}, {"title": "Fisk på kjøkkenet", "short": "Tilbered fisk", "group": "Oppskrifter", "lead": "Bruk det du har lært til å velge fisk, behandle den riktig og planlegge et måltid.", "body": "<section class=\"card\"><h2>Tre måter å tilberede fisk på<\/h2><div class=\"grid3\"><div class=\"mini\"><h3>Trekke<\/h3><p>La fisken trekke forsiktig i varm væske, framfor å fosskoke. Kraftig koking kan gjøre at fisken faller fra hverandre.<\/p><\/div><div class=\"mini\"><h3>Steke<\/h3><p>Unngå unødvendig høy varme. Ved steking av filet med skinn kan skinnsiden ligge ned først og beskytte fiskekjøttet.<\/p><\/div><div class=\"mini\"><h3>Bake i ovn<\/h3><p>Bruk temperatur og tid fra oppskriften og tilpass etter tykkelsen. Følg med underveis, så fisken ikke blir tørr.<\/p><\/div><\/div><p>Læreren hjelper dere å kontrollere at fisken er ferdig tilberedt. Det finnes ikke én steketid som passer alle fiskestykker.<\/p><\/section><section class=\"card\"><h2>Velg en rett og lag en plan<\/h2><p>Fiskepresentasjonen foreslår laksetaco, lakselasagne, laksewok og fiskeburger. Dette er ideer til retter, ikke fullstendige oppskrifter med mengder og tider.<\/p><ol><li>Velg en rett sammen med gruppen.<\/li><li>Avtal en fullstendig oppskrift og mengder med læreren.<\/li><li>Finn råvarer og fordel oppgavene.<\/li><li>Planlegg når fisken skal tas ut av kjøleskapet.<\/li><li>Lag retten etter avtalt oppskrift, og vurder smak og konsistens.<\/li><\/ol><p>Koble gjerne til det du allerede kan: Potetene fra kjøttkakemåltidet kan være tilbehør til fisk. Grønnsaker og grove kornprodukter kan bidra med fiber.<\/p><\/section><section class=\"card\"><h2>Matvalg, kultur og bærekraft<\/h2><p>Fisk inngår i mange matkulturer. Ta hensyn til gruppens ønsker, allergier og matregler når dere planlegger.<\/p><p>Miljøbelastningen av sjømat varierer med blant annet fiskeslag, fangst eller oppdrett og transport. Unngå derfor å anta at all fisk har likt klimaavtrykk. Bruk opp råvarene og planlegg mengdene for å redusere matsvinn.<\/p><\/section>", "source": "FISK, lysbilde 2–3 og 8–9. Kilden inneholder tilberedningsråd og rettforslag, men ingen fullstendig fiskeoppskrift. Påstandene om religion og klima er nyansert. Praktisk planlegging er et pedagogisk tillegg.", "qs": [{"id": "q48", "type": "order", "title": "Lag en fornuftig arbeidsrekkefølge for et fiskemåltid.", "items": ["Les oppskriften, avtal mengder og fordel oppgavene.", "Vask hendene og gjør klar rene redskaper og tilbehør.", "Ta fram fisken fra kjøleskapet når du er klar til å arbeide med den.", "Tilbered fisken etter oppskriften og kontroller resultatet med læreren.", "Smak til og server med ferdig tilbehør."], "why": "Planlegg først, gjør arbeidsplassen klar, og ta fram fisken når den trengs. Følg deretter oppskriften og server."}, {"id": "q49", "type": "mc", "title": "Hva betyr det at fisken skal trekke?", "options": ["At den skal fosskoke så kraftig som mulig.", "At den varmes forsiktig i varm væske.", "At den skal stå rå på benken."], "correct": 1, "why": "Trekking er forsiktig tilberedning i varm væske. Unngå kraftig koking som kan ødelegge konsistensen.", "hint": "Tenk på forskjellen mellom rolig varme og fosskoking."}, {"id": "q50", "type": "text", "title": "Planlegg en fiskerett for gruppen: Velg fisk, forklar ett næringsbidrag, beskriv to hygienerutiner og velg en tilberedningsmåte.", "model": "Vi velger laks med poteter og grønnsaker. Laks gir protein, omega-3 og vitamin D. Vi holder fisken kald fram til bruk og bruker eget rent brett og egen kniv. Vi baker fisken i ovn etter en oppskrift vi avtaler med læreren og kontrollerer at den er ferdig. Andre fiskeslag og metoder kan også passe.", "criteria": ["Jeg velger en fisk og forklarer ett næringsbidrag.", "Jeg beskriver to relevante hygienerutiner.", "Jeg velger en passende tilberedningsmåte og bruker en avtalt oppskrift."]}]}], "recipes": {"lapskaus": {"title": "Grønnsakslapskaus", "base": "Mengder etter avtale med læreren", "note": "Presentasjonen oppgir grønnsaker, vann, én buljongterning, salt og pepper, men ingen fullstendig mengdeliste. Velg grønnsaker og mengder sammen med læreren.", "ingredients": [], "steps": ["Vask og rens grønnsakene. Del purre på langs og skyll mellom lagene dersom du bruker purre.", "Lag en stødig skjæreflate. Kutt grønnsakene i jevnstore biter.", "Ha grønnsakene i en gryte. Tilsett vann til det nesten dekker grønnsakene.", "Tilsett én buljongterning, og kok til grønnsakene er møre.", "Rør rundt og smak til med salt og pepper. Bruk ren skje og smaksskål."], "source": "Grønnsakslapskaus, lysbilde 8–9."}, "selleri": {"title": "Sellerisuppe", "base": "Én grunnoppskrift fra presentasjonen", "note": "Antall porsjoner er ikke oppgitt i kilden. Velg 1×, 2× eller 3× grunnoppskriften. Urter etter smak. Grønnsaksmengden er cirka.", "ingredients": [["Liten løk", [1, 1], "stk"], ["Hvitløk", [1, 2], "fedd"], ["Olje", [1, 2], "ss"], ["Sellerirot", [300, 300], "g"], ["Vann", [5, 6], "dl"], ["Hønse- eller grønnsakbuljong", [1, 1], "terning"], ["Melk eller matfløte", [0.5, 0.5], "dl"], ["Pepper", [0.5, 0.5], "krm"]], "steps": ["Skyll, rens og del opp grønnsakene.", "Varm oljen i kjelen. Surr løk og hvitløk til de er myke og blanke.", "Tilsett grønnsake function feedback(q,a){if(q.type==='text')return a.reveal?`<div class="model-answer"><h4>Svarforslag</h4><p>${esc(q.model)}</p><p class="status">Flere formuleringer kan være riktige. Sammenlign innholdet, ikke bare ordene.</p></div><div class="selfcheck">${q.criteria.map((c,i)=>`<label><input type="checkbox" data-criterion="${i}" ${a.criteria[i]?'checked':''}><span>${esc(c)}</span></label>`).join('')}</div><p class="status" role="status">${done(q)?'Egenvurdering gjennomført.':'Kryss av for det svaret ditt dekker. Du kan forbedre teksten over.'}</p>`:'';if(!a.checked)return '';let good=correct(q,a);return `<div class="feedback ${good?'good':''}" role="status"><strong>${good?'Riktig!':'Prøv igjen.'}</strong> ${esc(good?q.why:(q.hint||'Se over fagstoffet. Kontroller alle delene av svaret og prøv igjen.'))}</div>`}

function answerText(q){const a=answer(q);if(q.type==='mc')return a.value===null?'Ikke besvart':q.options[a.value];if(q.type==='multi')return a.value.map(i=>q.options[i]).join('; ')||'Ikke besvart';if(q.type==='match')return q.rows.map((r,i)=>r+': '+(q.options[a.value[i]]??'Ikke besvart')).join('\n');if(q.type==='order')return a.value.map((j,i)=>(i+1)+'. '+q.items[j]).join('\n');return String(a.value||'Ikke besvart')+(q.type==='number'&&a.value?' '+q.unit:'')}

const TERMS=[['Omega-3','En gruppe flerumettede fettsyrer. Fet fisk er en viktig kilde til marine omega-3-fettsyrer.'],['Fet og mager fisk','Eksempler på fet fisk er laks, makrell og sild. Eksempler på mager fisk er torsk, sei og hyse.'],['Trekke fisk','Tilberede fisken forsiktig i varm væske, framfor å fosskoke.'],['Mettet og umettet fett','Ulike typer fett. Matvarer inneholder ofte en blanding. Oljer, nøtter og fet fisk er vanlige kilder til mye umettet fett.'],['Aminosyre','En byggestein i proteiner.'],['Essensiell','Et næringsstoff eller en byggestein vi må få gjennom maten fordi kroppen ikke lager nok selv.'],['Næringsstoff','Et stoff i maten kroppen trenger for å fungere.'],['Energi','Det kroppen trenger blant annet til bevegelse, varme og arbeid i cellene. Måles i kJ eller kcal.'],['Stivelse','Et karbohydrat som finnes blant annet i poteter og korn.'],['Fiber','Karbohydrater som ikke brytes ned av våre egne fordøyelsesenzymer. Viktig for tarmfunksjon.'],['Glukose','En enkel sukkerart. Glukose i blodet omtales ofte som blodsukker.'],['Insulin','Et hormon som hjelper glukose fra blodet inn i cellene.'],['Fettløselig','Kan løses i fett. A, D, E og K er fettløselige vitaminer.'],['Vannløselig','Kan løses i vann. B-vitaminene og vitamin C er vannløselige.'],['Mineral','Et grunnstoff kroppen trenger, for eksempel jern eller kalsium.'],['Fullkorn','Korn der alle delene – skall, kjerne og kime – er med.'],['Gluten','Proteiner som kan danne et elastisk nettverk i blant annet hvetedeig.'],['Forklistring','Stivelse binder vann og sveller under oppvarming, slik at blandingen tykner.'],['Kryssforurensning','Bakterier eller annen forurensning overføres mellom matvarer, hender eller utstyr.'],['Spe','Tilsette væske litt etter litt mens du rører.'],['Surre','Varme forsiktig i litt fett, for eksempel til løken er myk og blank.'],['Puré','Mat som er most til en jevn konsistens.'],['Tradisjonsmat','Matretter og matvaner som har blitt videreført over tid.'],['Måleenheter','1 l = 10 dl. 1 ss = 15 ml. 1 ts = 5 ml. 1 krm = 1 ml.']];
$('#terms').innerHTML=TERMS.map(([t,d])=>`<section class="glossary-entry"><h3>${esc(t)}</h3><p>${esc(d)}</p></section>`).join('');$('#closeGloss').onclick=()=>$('#glossary').close();$('#cancelReset').onclick=()=>$('#resetDialog').close();$('#confirmReset').onclick=()=>{state=empty();persist();$('#resetDialog').close();render();notify('Svar og framdrift er nullstilt i denne nettleseren.')};shell();render(false);
